# ITPRA ontology — relationship types: the verbs a term's `relates_to` may use.
# type: RelationshipType. Ids are the verbs (snake_case). Decided in ADR 0008.

- id: grouped_by
  term: grouped by
  type: RelationshipType
  definition: >
    The subject is organized under the target grouping — a capability under its capability domain, a
    capability domain under its plane, a journey under its journey group, a plane or journey group under a
    framework tier. Single-valued.
  source: ADR 0008 (amended by ADR 0047)

- id: consumed_by
  term: consumed by
  type: RelationshipType
  definition: The subject is used by the target persona, a human role archetype; a delegated actor's use counts as its accountable persona's (ADR 0030).

- id: realized_in
  term: realized in
  type: RelationshipType
  definition: >
    The subject is exercised by / made concrete in the target journey: a capability exercised in a journey,
    or a workflow that diagrams one.
  source: ADR 0008 (amended by ADR 0047)

- id: depends_on
  term: depends on
  type: RelationshipType
  definition: The subject requires the target to function.

- id: decomposes_into
  term: decomposes into
  type: RelationshipType
  definition: >
    The subject (a broader capability) decomposes into finer child capabilities (the target). Used when a
    T1 capability fans out into more granular T2 child capabilities, or for any parent/child capability
    breakdown. The child capability also records `derived_from` its parent capability.

- id: supports
  term: supports
  type: RelationshipType
  definition: >
    The subject (a function) supports / helps realize the target capability. Many-to-many: one function may
    support several capabilities across domains (e.g. event correlation supports both observability and
    security), and a capability is realized by several functions. The function↔capability link of the
    granular function layer (ADR 0011).

- id: met_by
  term: met by
  type: RelationshipType
  definition: The subject requirement is satisfied by the target capability.
  source: ADR 0008 (amended by ADR 0047)

- id: verified_by
  term: verified by
  type: RelationshipType
  definition: The subject requirement is demonstrated or evidenced by the target journey.
  source: ADR 0008 (amended by ADR 0047)

- id: categorized_as
  term: categorized as
  type: RelationshipType
  definition: The subject non-functional requirement belongs to the target quality attribute; single-valued.
  source: ADR 0008 (amended by ADR 0047)

- id: derived_from
  term: derived from
  type: RelationshipType
  definition: >
    The subject child capability is derived from the target parent capability. Used only in capability
    decomposition (the reciprocal of `decomposes_into`); NOT valid on Function records (ADR 0011).

- id: supersedes
  term: supersedes
  type: RelationshipType
  definition: The subject decision record replaces the target decision record.
  source: ADR 0008 (amended by ADR 0047)

- id: owns
  term: owns
  type: RelationshipType
  definition: The subject persona is accountable for the target capability.
  source: ADR 0008 (amended by ADR 0047)

- id: governs
  term: governs
  type: RelationshipType
  definition: >
    The subject constrains the target: an operating model constrains a workflow, or a governing concept (such
    as the automation boundary) constrains the functions and concepts that act under it.
  source: ADR 0008 (amended by ADR 0047)

- id: applies_to
  term: applies to
  type: RelationshipType
  definition: The subject is relevant to the target scope.

- id: produces
  term: produces
  type: RelationshipType
  definition: The subject service yields or exposes the target capability.
  source: ADR 0008 (amended by ADR 0047)

- id: interfaces_with
  term: interfaces with
  type: RelationshipType
  definition: >
    The subject exchanges with the target across a boundary, where neither contains the other — a
    context-boundary relationship. Its declared pair is a service domain to a capability plane; the vocabulary
    holds no instance of it, and an edge is added only by a decision record that decides it.
  source: ADR 0008 (amended by ADR 0047)

- id: belongs_to_service_domain
  term: belongs to service domain
  type: RelationshipType
  definition: >
    The subject capability domain is owned by the target service domain, its single owning service domain.
    Single-valued: every capability domain carries exactly one.
  source: ADR 0008 (amended by ADR 0046, ADR 0047)
