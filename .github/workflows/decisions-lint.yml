name: decisions-lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the decision records
        run: python tools/adr-lint.py --strict
      - name: Test the lint
        run: python -m unittest discover -s tests -v
