# ITPRA ontology — journey groups: journeys grouped by lifecycle phase and cross-cutting concern
# SHARED file: it belongs to no single service domain, so neither its name nor its ids carry a service-domain code.
# type: JourneyGroup. Ids JG-<slug>. Decided in ADR 0013.

- id: JG-ONBOARDING
  term: Onboarding
  type: JourneyGroup
  definition: >
    Establishing a consumer, team, or workload on a service — access, identity, tenancy, and first use along
    a golden path. The entry point that precedes the design -> deploy -> operate loop.
  source: ADR 0013 (amended by ADR 0047)

- id: JG-DELIVERY
  term: Build & Deliver
  type: JourneyGroup
  definition: >
    Designing, building, testing, deploying, releasing, and promoting a workload or change into service — the
    recurring delivery loop spanning the design and deploy phases.
  source: ADR 0013 (amended by ADR 0047)

- id: JG-OPERATIONS
  term: Operate
  type: JourneyGroup
  definition: >
    Running, observing, scaling, patching, and making routine changes to keep a service and its workloads
    healthy — the ongoing operate phase, which runs for the lifetime of what is operated.
  source: ADR 0013 (amended by ADR 0047)

- id: JG-RESPONSE
  term: Respond & Recover
  type: JourneyGroup
  definition: >
    Detecting and responding to disruption — incidents, rollback, disaster recovery and restore, and
    security response. The exception paths off the steady-state operate loop.
  source: ADR 0013

- id: JG-GOVERNANCE
  term: Govern & Assure
  type: JourneyGroup
  definition: >
    Request, approval, and change; compliance and audit evidence; cost and value review; and access and
    tenancy review — the cross-cutting governance and assurance journeys.
  source: ADR 0013

- id: JG-EVOLUTION
  term: Evolve & Retire
  type: JourneyGroup
  definition: >
    Upgrading and migrating, decommissioning and offboarding, and the service-as-a-product feedback loop
    (defect/nomination -> backlog -> roadmap) — how a service and its workloads change and end.
  source: ADR 0013 (amended by ADR 0047)
