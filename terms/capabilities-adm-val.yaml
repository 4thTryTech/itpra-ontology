# ITPRA ontology — ADM-VAL (Application Performance & Value Insight): capabilities
# type: Capability. Ids CAP-ADM-VAL-<n>, each grouped under ADM-VAL. Decided in ADR 0021.

- id: CAP-ADM-VAL-1
  term: Application Performance & Behavior Insight
  type: Capability
  definition: >
    Observes how the running application behaves — response time, error rate, and user-facing performance —
    to find and resolve application-level performance issues. Application-level insight; consumes platform/
    workload observability signals (ITO-OBS) but does not own them.
  relates_to:
    - {rel: grouped_by, target: ADM-VAL}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
    - {rel: consumed_by, target: PERSONA-adm-app-support}
  source: ADR 0021

- id: CAP-ADM-VAL-2
  term: Feature Adoption & Usage Insight
  type: Capability
  definition: >
    Measures how the application's features are actually used and adopted — uptake, usage patterns, and
    abandonment — so the team learns what delivers value and what does not, informing the roadmap.
  relates_to:
    - {rel: grouped_by, target: ADM-VAL}
    - {rel: consumed_by, target: PERSONA-adm-business-owner}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0021

- id: CAP-ADM-VAL-3
  term: Business-Value & Outcome Insight
  type: Capability
  definition: >
    Connects application output to business outcomes — whether shipped change created tangible value against
    its intent — so investment decisions and the portfolio are informed by realized value, not just
    activity.
  relates_to:
    - {rel: grouped_by, target: ADM-VAL}
    - {rel: depends_on, target: CAP-ADM-VAL-2}
    - {rel: consumed_by, target: PERSONA-adm-business-owner}
  source: ADR 0021

- id: CAP-ADM-VAL-4
  term: Engineering Flow & Delivery Insight
  type: Capability
  definition: >
    Measures how well the application practice itself delivers — flow, delivery cadence, change-failure, and
    time-to-restore — so the team can see and improve its own engineering effectiveness over time.
  relates_to:
    - {rel: grouped_by, target: ADM-VAL}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0021

- id: CAP-ADM-VAL-5
  term: Agentic Execution Explainability
  type: Capability
  definition: >
    Accounts for a particular execution of a model-grounded or autonomous application component — the inputs
    used, the context and instructions in force, the model binding, the decision and tool-use steps taken with
    their results, and the output produced — captured at run time and rendered intelligibly to the people
    accountable for the application and to those affected by the outcome. Single-execution and
    accountability-facing, which distinguishes it from aggregate performance insight (CAP-ADM-VAL-1), from
    request tracing that locates latency and error, and from offline trajectory evaluation (CAP-ADM-QAT-6),
    which scores paths against reference cases. Consumes the platform's telemetry (ITO-OBS) and the harness's
    action record (CAP-ITO-AUT-8) but owns the account.
  aliases: [agent decision audit, execution accounting, agentic explainability, decision trace]
  relates_to:
    - {rel: grouped_by, target: ADM-VAL}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
    - {rel: consumed_by, target: PERSONA-adm-ai-assurance}
    - {rel: consumed_by, target: PERSONA-adm-app-support}
    - {rel: depends_on, target: CAP-ADM-ENG-7}
  source: ADR 0040
