# ITPRA ontology — Digital Experience & Channels (DXC) capability domains
# type: Domain. The `id` IS the domain code used in capability ids: CAP-<id>-<n> (child: CAP-<id>-<n>.<m>). Each
# domain is `grouped_by` an EXISTING capability PLANE (terms/planes.yaml). DXC capabilities span the Experience
# and Delivery planes; each group is placed under the fitting existing plane. Taxonomy ratified by ADR 0027.
# Owning service domain: SD-DIGITAL-EXPERIENCE (interfaces_with PLANE-EXPERIENCE and PLANE-DELIVERY; see ADR
# 0009 + ADR 0027). DXC is the CUSTOMER-FACING digital experience discipline; its consumers are
# EXTERNAL customers; it runs ON the platform but the platform does not own its experience logic. Explicitly NOT
# Digital Experience MONITORING (CAP-ITO-OBS-9).

- id: DXC-CNT
  term: Content Management & Composition
  type: Domain
  definition: >
    Authoring, managing, and composing the customer-facing content of the digital experience — structured
    content modeling and authoring, composition/assembly of deliverable experiences from modular content,
    digital asset management, content workflow and governance (review, approval, versioning, brand
    compliance, lifecycle), and create-once multi-channel content delivery. The content substrate the
    other DXC domains personalize, orchestrate, and deliver.
  relates_to:
    - {rel: grouped_by, target: PLANE-EXPERIENCE}
    - {rel: belongs_to_service_domain, target: SD-DIGITAL-EXPERIENCE}
  source: ADR 0027

- id: DXC-PER
  term: Personalization & Targeting
  type: Domain
  definition: >
    Tailoring the customer-facing experience to an audience or individual — audience segmentation and
    targeting (rule-based and predictive), content and offer personalization, content/product
    recommendation, and the governed decisioning ruleset that selects the next best experience. Consumes the
    unified customer profile (DXC-CDP) and is applied through the channels (DXC-CHN); its lift is measured by
    experimentation (DXC-EXP).
  relates_to:
    - {rel: grouped_by, target: PLANE-EXPERIENCE}
    - {rel: belongs_to_service_domain, target: SD-DIGITAL-EXPERIENCE}
  source: ADR 0027

- id: DXC-JRN
  term: Customer Journey Orchestration
  type: Domain
  definition: >
    Designing, running, and optimizing cross-channel customer journeys — journey design and mapping, journey
    execution and orchestration, real-time decisioning and next-best-action, and journey analytics and
    friction insight. A Delivery-plane discipline that provisions and ships the running experience flow,
    coordinating the next step across channels, distinct from authoring the content it moves.
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-DIGITAL-EXPERIENCE}
  source: ADR 0027

- id: DXC-CDP
  term: Customer Data & Profiles
  type: Domain
  definition: >
    The customer-facing customer-data discipline — ingestion and integration of first-party customer data,
    identity resolution into a persistent unified profile, audience segmentation, customer-facing consent and
    preference management, and activation/distribution of profiles and audiences to the other DXC domains and
    downstream analytics. Operates the customer profile and consent experience; the enterprise privacy
    control catalog (Enterprise Security/GRC) and business analytics of customer data (Business Intelligence &
    Analytics) are adjacent.
  relates_to:
    - {rel: grouped_by, target: PLANE-EXPERIENCE}
    - {rel: belongs_to_service_domain, target: SD-DIGITAL-EXPERIENCE}
  source: ADR 0027

- id: DXC-EXP
  term: Experimentation & Optimization
  type: Domain
  definition: >
    Evidence-driven evolution of the customer experience — experiment design and hypothesis management,
    variant assignment and exposure control, result measurement and statistical analysis, and the
    optimization/rollout decision that promotes, holds, or rolls back an experience variant. A Delivery-plane
    discipline that controls which experience variant ships to whom and measures changes made by
    personalization (DXC-PER) and journeys (DXC-JRN).
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-DIGITAL-EXPERIENCE}
  source: ADR 0027

- id: DXC-COM
  term: Digital Commerce
  type: Domain
  definition: >
    The customer-facing commerce experience — product catalog and merchandising, product search and
    discovery, the cart and checkout experience, and pricing/promotions and the customer order experience.
    Owns the experience of buying; payment processing and order-fulfilment execution are downstream/back-office
    mechanisms it interfaces with. Consumes content (DXC-CNT), profile (DXC-CDP), and personalization
    (DXC-PER) and is delivered through the channels (DXC-CHN).
  relates_to:
    - {rel: grouped_by, target: PLANE-EXPERIENCE}
    - {rel: belongs_to_service_domain, target: SD-DIGITAL-EXPERIENCE}
  source: ADR 0027

- id: DXC-CHN
  term: Channel Delivery & Experience Insight
  type: Domain
  definition: >
    Delivering the composed, personalized experience to every customer channel and understanding how it
    performs — multi-channel experience delivery (create-once / publish-everywhere), delivery and front-end
    API services, edge delivery and experience performance, digital channel presence management, and the
    customer-outcome view of channel experience insight (engagement, conversion, friction). The technical
    monitoring of end-user/page performance and availability is the platform's observability concern
    (ITO-OBS, CAP-ITO-OBS-9) this domain interfaces with — not DXC.
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-DIGITAL-EXPERIENCE}
  source: ADR 0027
