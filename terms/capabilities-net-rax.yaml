# ITPRA ontology — NET-RAX (Remote & Secure Access) capabilities
# type: Capability. ids CAP-NET-RAX-<n>. Grouped under domain NET-RAX (ADR 0023).

- id: CAP-NET-RAX-1
  term: Site-to-Site Secure Interconnect
  type: Capability
  definition: >
    Links sites, data centers, and cloud networks into one routed enterprise network over encrypted, integrity-
    protected tunnels, so locations interconnect securely across any underlying transport.
  relates_to:
    - {rel: grouped_by, target: NET-RAX}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
    - {rel: consumed_by, target: PERSONA-net-security-compliance}
  source: ADR 0023

- id: CAP-NET-RAX-2
  term: Remote Workforce Secure Access
  type: Capability
  definition: >
    Provides a secure network path for remote and roaming users to reach the enterprise resources they need,
    from any location, over an encrypted connection terminated at a governed access point.
  relates_to:
    - {rel: grouped_by, target: NET-RAX}
    - {rel: consumed_by, target: PERSONA-net-consumer}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023

- id: CAP-NET-RAX-3
  term: Zero-Trust Network Access
  type: Capability
  definition: >
    Grants access to applications per-application by verified identity, device posture, and context with no
    implicit network trust — connecting a user to only what they are entitled to, rather than to a broad network.
  relates_to:
    - {rel: grouped_by, target: NET-RAX}
    - {rel: depends_on, target: CAP-NET-RAX-2}
    - {rel: consumed_by, target: PERSONA-net-security-compliance}
    - {rel: consumed_by, target: PERSONA-net-consumer}
  source: ADR 0023

- id: CAP-NET-RAX-4
  term: Access Policy Enforcement
  type: Capability
  definition: >
    Defines and enforces who and what may traverse which access path under which conditions — the access-policy
    decision and enforcement point shared by site-to-site, remote, and zero-trust access.
  relates_to:
    - {rel: grouped_by, target: NET-RAX}
    - {rel: depends_on, target: CAP-NET-RAX-3}
    - {rel: consumed_by, target: PERSONA-net-security-compliance}
  source: ADR 0023
