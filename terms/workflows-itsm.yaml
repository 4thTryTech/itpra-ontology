# ITPRA ontology — IT Service Management & Integration (ITSM) workflow catalog
# type: Workflow. ids WF-itsm-<slug>. Each is `realized_in` exactly one ITSM journey (JRN-itsm-<slug>) workflow
# per journey (13).

- id: WF-itsm-onboard-provider
  term: Onboard a Service Provider (diagram)
  type: Workflow
  definition: Flow diagram of bringing a provider into the coordinated chain.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-onboard-provider}
  source: ADR 0025

- id: WF-itsm-introduce-service
  term: Introduce a Service into the Catalog (diagram)
  type: Workflow
  definition: Flow diagram of authorizing, defining, committing, and publishing a service.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-introduce-service}
  source: ADR 0025

- id: WF-itsm-fulfill-cross-domain-request
  term: Fulfill a Cross-Domain Request (diagram)
  type: Workflow
  definition: Flow diagram of intake, routing, approval, and orchestration of a cross-provider request.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-fulfill-cross-domain-request}
  source: ADR 0025

- id: WF-itsm-coordinate-cross-provider-change
  term: Coordinate a Cross-Provider Change (diagram)
  type: Workflow
  definition: Flow diagram of assessing, authorizing, scheduling, and reconciling a cross-provider change.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-coordinate-cross-provider-change}
  source: ADR 0025

- id: WF-itsm-monitor-service-levels
  term: Monitor End-to-End Service Levels (diagram)
  type: Workflow
  definition: Flow diagram of measuring and watching headroom on end-to-end commitments across providers.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-monitor-service-levels}
  source: ADR 0025

- id: WF-itsm-integrate-systems-of-record
  term: Integrate the Systems of Record (diagram)
  type: Workflow
  definition: Flow diagram of federating, normalizing, reconciling, and relating provider records.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-integrate-systems-of-record}
  source: ADR 0025

- id: WF-itsm-coordinate-cross-provider-incident
  term: Coordinate a Cross-Provider Incident (diagram)
  type: Workflow
  definition: Flow diagram of detecting, triaging, and coordinating restoration of a cross-provider incident.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-coordinate-cross-provider-incident}
  source: ADR 0025

- id: WF-itsm-run-major-incident
  term: Run a Major Cross-Provider Incident (diagram)
  type: Workflow
  definition: Flow diagram of running a high-impact cross-provider incident with one coordinating authority.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-run-major-incident}
  source: ADR 0025

- id: WF-itsm-resolve-cross-provider-problem
  term: Resolve a Cross-Provider Problem (diagram)
  type: Workflow
  definition: Flow diagram of cross-provider root-cause analysis and corrective action to closure.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-resolve-cross-provider-problem}
  source: ADR 0025

- id: WF-itsm-review-provider-performance
  term: Review Provider Performance & Commitments (diagram)
  type: Workflow
  definition: Flow diagram of assessing provider performance against commitments and driving remediation.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-review-provider-performance}
  source: ADR 0025

- id: WF-itsm-assure-record-integrity
  term: Assure Integrated-Record Integrity (diagram)
  type: Workflow
  definition: Flow diagram of governing authoritative sources, write control, and record freshness/accuracy.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-assure-record-integrity}
  source: ADR 0025

- id: WF-itsm-improve-service-value
  term: Improve End-to-End Service Value (diagram)
  type: Workflow
  definition: Flow diagram of measuring value, prioritizing improvements, and driving them across providers.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-improve-service-value}
  source: ADR 0025

- id: WF-itsm-retire-or-transition-service
  term: Retire or Transition a Service (diagram)
  type: Workflow
  definition: Flow diagram of retiring or re-sourcing a service across its providers with a clean end state.
  relates_to:
    - {rel: realized_in, target: JRN-itsm-retire-or-transition-service}
  source: ADR 0025
