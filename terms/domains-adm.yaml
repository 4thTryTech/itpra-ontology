# ITPRA ontology — Application Development & Maintenance (ADM) capability domains
# type: Domain. The `id` IS the domain code used in capability ids: CAP-<id>-<n> (child: CAP-<id>-<n>.<m>). Each
# domain is `grouped_by` an EXISTING capability PLANE (terms/planes.yaml). SD-APP-DEV interfaces_with
# PLANE-DELIVERY and PLANE-EXPERIENCE; each group is placed under one of those two existing planes. Taxonomy
# ratified by ADR 0021; scope/boundary (incl. ADM-vs-platform-DEL) by ADR 0021. SCOPE: ADM is the CONSUMER side
# — teams that build/maintain business apps that RUN ON the platform. It does NOT own the platform's
# software-delivery (ITO DEL) pipeline/supply-chain; it consumes them. Owning service domain: SD-APP-DEV
# (interfaces_with PLANE-DELIVERY + PLANE-EXPERIENCE; ADR 0009 + ADR 0021).

- id: ADM-APM
  term: Application Portfolio & Lifecycle Management
  type: Domain
  definition: >
    Governance of the application portfolio across its lifecycle — an authoritative inventory of the
    organization's business applications and their relationships to business capabilities, each application's
    lifecycle state and roadmap, portfolio rationalization decisions (invest / tolerate / migrate /
    eliminate), and application sunset/decommission. Frames every application from ideation to retirement;
    distinct from the platform's service catalog of platform offerings (ITO).
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-APP-DEV}
  source: ADR 0021

- id: ADM-ENG
  term: Application Build & Engineering Practice
  type: Domain
  definition: >
    The application-side engineering practice that turns intent into working software — application design &
    architecture, implementation & code management, integration & interface engineering, application
    packaging & configuration, and engineering of application data & schema. Builds the application that runs
    on the platform; consumes the platform's software-delivery pipeline rather than owning it (ITO DEL).
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-APP-DEV}
  source: ADR 0021

- id: ADM-QAT
  term: Application Quality & Testing
  type: Domain
  definition: >
    Assurance that an application is fit for purpose — an application quality bar against a product-quality
    model, functional test design & execution, non-functional (performance/security/reliability) testing at
    the application level, test-data & test-environment readiness, and continuous quality verification &
    defect management. Verifies the application; the platform may provide test-execution surface this
    consumes.
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-APP-DEV}
  source: ADR 0021

- id: ADM-REL
  term: Application Release Coordination
  type: Domain
  definition: >
    Consumer-side coordination of getting application change into production — release planning & scheduling,
    cross-team and cross-application dependency coordination, release readiness & go/no-go decisioning, and
    progressive rollout & release verification of the application. Plans and coordinates what ships and when;
    the pipeline that executes build/deploy and the supply-chain controls are the platform's (ITO DEL).
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-APP-DEV}
  source: ADR 0021

- id: ADM-SUP
  term: Application Support & Maintenance Modes
  type: Domain
  definition: >
    Keeping a delivered application reliable, current, and supported — application-level support triage &
    resolution, corrective maintenance (defect fix), adaptive maintenance (keep current with a changing
    environment), perfective maintenance (value-adding enhancement), preventive maintenance (forestall latent
    problems), and the per-application support model across lifecycle stages (hypercare → steady state).
    Owns application resolution; distinct from the cross-domain contact channel (Service Desk) and platform
    runtime incidents (ITO).
  relates_to:
    - {rel: grouped_by, target: PLANE-EXPERIENCE}
    - {rel: belongs_to_service_domain, target: SD-APP-DEV}
  source: ADR 0021

- id: ADM-DEX
  term: Developer Enablement & Experience
  type: Domain
  definition: >
    The application team's consumer view of using the platform to build software — developer onboarding &
    enablement onto the platform's paved roads, self-service environment & resource access consumed from the
    platform, developer-portal/template/knowledge reuse, and developer-experience feedback. The experience of
    consuming the platform as a customer; distinct from the platform's own developer-platform engineering
    (ITO EXP/DEL).
  relates_to:
    - {rel: grouped_by, target: PLANE-EXPERIENCE}
    - {rel: belongs_to_service_domain, target: SD-APP-DEV}
  source: ADR 0021

- id: ADM-VAL
  term: Application Performance & Value Insight
  type: Domain
  definition: >
    Understanding how an application performs and the value it delivers — application performance & behavior
    insight (application-level), feature adoption & usage insight, business-value & outcome insight, and
    engineering-flow / delivery insight that feeds continuous improvement. Observes the application and its
    value; distinct from platform/workload observability (ITO OBS), whose signals it may consume.
  relates_to:
    - {rel: grouped_by, target: PLANE-EXPERIENCE}
    - {rel: belongs_to_service_domain, target: SD-APP-DEV}
  source: ADR 0021
