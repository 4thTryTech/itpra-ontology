# ITPRA ontology — DXC-CNT (Content Management & Composition) capabilities
# type: Capability. ids CAP-DXC-CNT-<n>. Grouped under domain DXC-CNT (ADR 0027); environment expression per ADR
# 0014.

- id: CAP-DXC-CNT-1
  term: Structured Content Modeling & Authoring
  type: Capability
  definition: >
    Models customer-facing content as reusable structured types and components and lets practitioners author,
    edit, and translate it independently of any presentation channel, so one body of content can serve every
    channel.
  relates_to:
    - {rel: grouped_by, target: DXC-CNT}
    - {rel: consumed_by, target: PERSONA-dxc-experience-practitioner}
    - {rel: consumed_by, target: PERSONA-dxc-experience-team}
  source: ADR 0027

- id: CAP-DXC-CNT-2
  term: Experience Composition & Assembly
  type: Capability
  definition: >
    Composes a deliverable customer experience (page, screen, view) by assembling modular structured content
    and components, so practitioners build and arrange experiences without rebuilding the underlying content
    or front end.
  relates_to:
    - {rel: grouped_by, target: DXC-CNT}
    - {rel: depends_on, target: CAP-DXC-CNT-1}
    - {rel: consumed_by, target: PERSONA-dxc-experience-practitioner}
  source: ADR 0027

- id: CAP-DXC-CNT-3
  term: Digital Asset Management
  type: Capability
  definition: >
    Ingests, organizes, versions, retrieves, and retires digital assets (images, video, documents, rich
    media) with metadata, controlled vocabulary, and rights/usage tracking, as the authoritative library the
    experience draws its media from.
  relates_to:
    - {rel: grouped_by, target: DXC-CNT}
    - {rel: consumed_by, target: PERSONA-dxc-experience-practitioner}
    - {rel: consumed_by, target: PERSONA-dxc-experience-team}
  source: ADR 0027

- id: CAP-DXC-CNT-4
  term: Content Workflow & Governance
  type: Capability
  definition: >
    Governs content through its lifecycle — review, approval, versioning, scheduling, brand and editorial
    compliance, and archival — so published content is accurate, on-brand, rights-cleared, and accountable.
    The lifecycle is the same whoever or whatever drafted the item: a machine-generated draft is governed here
    rather than by a parallel capability, because how content was produced is a property of the input, not a
    different governing practice. Accountability attaches at the approval gate (GC-APPROVAL) - a delegated
    actor (AUTON-ACTOR) never holds it - which requires the gate to see how the item came to exist
    (FUNC-dxc-content-provenance). The checks applied, including any disclosure obligation, are a T2 decision
    per regulatory context (ADR 0036).
  relates_to:
    - {rel: grouped_by, target: DXC-CNT}
    - {rel: depends_on, target: CAP-DXC-CNT-1}
    - {rel: consumed_by, target: PERSONA-dxc-experience-practitioner}
    - {rel: consumed_by, target: PERSONA-dxc-experience-governance}
  source: ADR 0027

- id: CAP-DXC-CNT-5
  term: Multi-Channel Content Delivery & Syndication
  type: Capability
  definition: >
    Makes managed content available to every consuming channel and front end on demand through content
    services, enabling create-once / publish-everywhere so the same content reaches web, app, and other
    channels consistently.
  relates_to:
    - {rel: grouped_by, target: DXC-CNT}
    - {rel: depends_on, target: CAP-DXC-CNT-2}
    - {rel: consumed_by, target: PERSONA-dxc-experience-team}
  source: ADR 0027
