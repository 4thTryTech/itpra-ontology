# ITPRA ontology — NET-QOS (Network Performance & Quality of Service): capabilities
# type: Capability. Ids CAP-NET-QOS-<n>, each grouped under NET-QOS. Decided in ADR 0023.

- id: CAP-NET-QOS-1
  term: Traffic Classification & Prioritization
  type: Capability
  definition: >
    Recognizes and marks traffic by application and importance and prioritizes it on the network, so latency-
    and loss-sensitive traffic receives the service it needs ahead of best-effort traffic.
  relates_to:
    - {rel: grouped_by, target: NET-QOS}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
    - {rel: consumed_by, target: PERSONA-net-operations}
  source: ADR 0023

- id: CAP-NET-QOS-2
  term: Traffic Shaping & Bandwidth Management
  type: Capability
  definition: >
    Shapes, polices, and allocates bandwidth across the network so capacity is used to plan — protecting
    critical traffic, bounding non-critical traffic, and preventing congestion from degrading service.
  relates_to:
    - {rel: grouped_by, target: NET-QOS}
    - {rel: depends_on, target: CAP-NET-QOS-1}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023

- id: CAP-NET-QOS-3
  term: Application-Aware Path Optimization
  type: Capability
  definition: >
    Steers and optimizes traffic by application across available paths and transports — choosing the path that
    best meets each application's performance need and optimizing the transport for it.
  relates_to:
    - {rel: grouped_by, target: NET-QOS}
    - {rel: depends_on, target: CAP-NET-QOS-1}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023

- id: CAP-NET-QOS-4
  term: Network Performance Management
  type: Capability
  definition: >
    Manages network performance against intended experience targets — measuring delay, jitter, loss, and
    throughput on the paths that matter and acting to keep application experience over the network predictable.
  relates_to:
    - {rel: grouped_by, target: NET-QOS}
    - {rel: depends_on, target: CAP-NET-QOS-2}
    - {rel: consumed_by, target: PERSONA-net-operations}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023
