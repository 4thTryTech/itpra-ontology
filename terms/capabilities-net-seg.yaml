# ITPRA ontology — NET-SEG (Network Security & Segmentation): capabilities
# type: Capability. Ids CAP-NET-SEG-<n>, each grouped under NET-SEG. Decided in ADR 0023.

- id: CAP-NET-SEG-1
  term: Network Edge Firewalling & Policy Enforcement
  type: Capability
  definition: >
    Enforces network security policy at the enterprise edge — admitting, denying, and inspecting traffic
    crossing the boundary between zones, sites, and the internet — applying the enterprise control intent to
    the network path.
  relates_to:
    - {rel: grouped_by, target: NET-SEG}
    - {rel: consumed_by, target: PERSONA-net-security-compliance}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023

- id: CAP-NET-SEG-2
  term: Network Segmentation & Micro-Segmentation
  type: Capability
  definition: >
    Divides the enterprise network into isolated zones and least-privilege segments between sites, zones, and
    application groups, so a compromise or fault in one segment cannot move laterally into another.
  relates_to:
    - {rel: grouped_by, target: NET-SEG}
    - {rel: consumed_by, target: PERSONA-net-security-compliance}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023

- id: CAP-NET-SEG-3
  term: Secure Web & Internet Egress
  type: Capability
  definition: >
    Governs outbound web and internet traffic at the edge — applying acceptable-use, threat, and data-
    protection policy to what enterprise users and systems reach on the internet — without backhauling all
    traffic to a single inspection point.
  relates_to:
    - {rel: grouped_by, target: NET-SEG}
    - {rel: depends_on, target: CAP-NET-SEG-1}
    - {rel: consumed_by, target: PERSONA-net-security-compliance}
  source: ADR 0023

- id: CAP-NET-SEG-4
  term: Cloud Application Access Governance
  type: Capability
  definition: >
    Governs how enterprise users and systems reach cloud applications across the network — applying access and
    data-handling policy to sanctioned and unsanctioned cloud-application traffic at the edge.
  relates_to:
    - {rel: grouped_by, target: NET-SEG}
    - {rel: depends_on, target: CAP-NET-SEG-3}
    - {rel: consumed_by, target: PERSONA-net-security-compliance}
  source: ADR 0023
