# ITPRA ontology — ITO-RES (Resilience & Continuity) capabilities
# type: Capability. ids CAP-ITO-RES-<n>. Grouped under domain ITO-RES (ADR 0017).

- id: CAP-ITO-RES-1
  term: Backup
  type: Capability
  definition: >
    Backs up platform and tenant state on a defined schedule, producing recoverable copies that meet
    retention policy.
  relates_to:
    - {rel: grouped_by, target: ITO-RES}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-platform-consumer}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-RES-2
  term: Restore
  type: Capability
  definition: >
    Restores backed-up state within defined recovery objectives, returning data and configuration to a
    known-good point after loss or corruption.
  relates_to:
    - {rel: grouped_by, target: ITO-RES}
    - {rel: depends_on, target: CAP-ITO-RES-1}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-platform-consumer}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-RES-3
  term: Disaster Recovery
  type: Capability
  definition: >
    Recovers services in an alternate location after a disruption, restoring operation when a primary site
    or region is lost.
  relates_to:
    - {rel: grouped_by, target: ITO-RES}
    - {rel: depends_on, target: CAP-ITO-RES-2}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-security-compliance}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-RES-4
  term: High Availability
  type: Capability
  definition: >
    Sustains defined availability targets through component failures, keeping services running without a
    single point of failure.
  relates_to:
    - {rel: grouped_by, target: ITO-RES}
    - {rel: depends_on, target: CAP-ITO-SUB-1}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-platform-consumer}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-RES-5
  term: Workload Mobility
  type: Capability
  definition: >
    Actively relocates running workloads — together with their state, identity, networking, and storage —
    across fault domains, locations, and environments with little-to-no disruption; used to evacuate
    degrading or maintained infrastructure, follow capacity, and migrate between environments.
    Operationalizes the portability quality and serves HA, DR relocation, and maintenance drains. Distinct
    from DR (post-disruption recovery) and HA (tolerate-in-place).
  aliases: [live migration, workload relocation, workload evacuation, application mobility]
  relates_to:
    - {rel: grouped_by, target: ITO-RES}
    - {rel: depends_on, target: CAP-ITO-SUB-1}
    - {rel: depends_on, target: CAP-ITO-SUB-2}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-RES-6
  term: Chaos Engineering
  type: Capability
  definition: >
    Verifies resilience by deliberately injecting controlled faults — service failures, network partitions,
    latency, resource exhaustion — under safety controls, confirming the system degrades gracefully and
    recovers and that alerts fire. Validates HA (CAP-ITO-RES-4), DR (CAP-ITO-RES-3), Restore (CAP-ITO-RES-2), and
    Workload Mobility (CAP-ITO-RES-5); observes outcomes via observability.
  aliases: [fault injection, resilience testing, chaos testing, game day]
  relates_to:
    - {rel: grouped_by, target: ITO-RES}
    - {rel: depends_on, target: CAP-ITO-OBS-1}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
  source: ADR 0017 (amended by ADR 0045)
