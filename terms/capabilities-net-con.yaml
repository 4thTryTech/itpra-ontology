# ITPRA ontology — NET-CON (Connectivity Provisioning & WAN): capabilities
# type: Capability. Ids CAP-NET-CON-<n>, each grouped under NET-CON. Decided in ADR 0023.

- id: CAP-NET-CON-1
  term: Site & Branch Connectivity Provisioning
  type: Capability
  definition: >
    Provisions network connectivity for a site, branch, or location — bringing it onto the enterprise network
    over any available transport so its users and systems can reach enterprise and internet resources.
  relates_to:
    - {rel: grouped_by, target: NET-CON}
    - {rel: consumed_by, target: PERSONA-net-consumer}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023

- id: CAP-NET-CON-2
  term: WAN Overlay & Path Selection
  type: Capability
  definition: >
    Operates the corporate wide-area overlay that abstracts multiple underlying transports into one intelligent
    network, selecting paths dynamically by policy and link health so traffic takes the best available route.
  relates_to:
    - {rel: grouped_by, target: NET-CON}
    - {rel: depends_on, target: CAP-NET-CON-1}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023

- id: CAP-NET-CON-3
  term: Transport Abstraction & Underlay Management
  type: Capability
  definition: >
    Treats diverse underlying transports — dedicated, broadband, mobile, and private links — as interchangeable
    underlays the network can use and substitute, decoupling the enterprise network from any one carrier or
    medium.
  relates_to:
    - {rel: grouped_by, target: NET-CON}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023

- id: CAP-NET-CON-4
  term: Internet Edge Connectivity
  type: Capability
  definition: >
    Provisions and operates the enterprise's connectivity to the public internet — the internet edge through
    which the organization reaches and is reached by external services — as a managed, governed boundary.
  relates_to:
    - {rel: grouped_by, target: NET-CON}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
    - {rel: consumed_by, target: PERSONA-net-consumer}
  source: ADR 0023

- id: CAP-NET-CON-5
  term: Cloud & SaaS On-Ramp Connectivity
  type: Capability
  definition: >
    Provides optimized, governed network paths from sites and the infrastructure platform to cloud providers
    and SaaS, so cloud-bound traffic reaches its destination efficiently rather than being backhauled through
    a central point.
  relates_to:
    - {rel: grouped_by, target: NET-CON}
    - {rel: depends_on, target: CAP-NET-CON-2}
    - {rel: consumed_by, target: PERSONA-net-engineering-team}
  source: ADR 0023 (amended by ADR 0047)
