# ITPRA ontology — FUNCTION library, GRC-CMP (Compliance, Audit & Evidence)
# type: Function. ids FUNC-grc-<slug>. All T1-neutral; functions MAY name a standard/framework where that IS the
# function (ADR 0011). Functions `support` >=1 capability. See ADR 0024.

# Control framework & obligation mapping (CAP-GRC-CMP-1)
- id: FUNC-grc-control-framework-mapping
  term: Control Framework & Crosswalk Mapping
  type: Function
  definition: Maintains a unified control set and crosswalks obligations (e.g. ISO/IEC 27001 Annex A, SOC 2 Trust Services Criteria, NIST SP 800-53) onto it.
  aliases: [control crosswalk, unified control framework, obligation mapping]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-1}
  source: ADR 0024

- id: FUNC-grc-obligation-register
  term: Obligation & Authority-Document Register
  type: Function
  definition: Maintains the register of applicable regulations, standards, and contractual obligations the enterprise must meet.
  aliases: [authority documents, regulatory register, compliance scope]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-1}
    - {rel: supports, target: CAP-GRC-CMP-5}
  source: ADR 0024

# Internal audit & assurance (CAP-GRC-CMP-2)
- id: FUNC-grc-audit-planning
  term: Audit Planning & Execution
  type: Function
  definition: Plans and conducts internal audits and assurance reviews of controls and management systems on a risk-based schedule.
  aliases: [internal audit, assurance review, ISMS internal audit]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-2}
  source: ADR 0024

- id: FUNC-grc-finding-management
  term: Audit Finding & Remediation Tracking
  type: Function
  definition: Records audit findings and tracks corrective actions to closure with owners and dates.
  aliases: [corrective action plan, finding remediation, CAPA]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-2}
  source: ADR 0024

# External audit, attestation & certification (CAP-GRC-CMP-3)
- id: FUNC-grc-auditor-coordination
  term: External Auditor Coordination
  type: Function
  definition: Coordinates external auditors and assessors and marshals the evidence they require across estates.
  aliases: [audit coordination, assessor liaison]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-3}
  source: ADR 0024

- id: FUNC-grc-certification-management
  term: Certification & Attestation Management
  type: Function
  definition: Maintains the enterprise's certifications and attestation reports (e.g. ISO/IEC 27001 certification, SOC 2 report) and their renewal.
  aliases: [certification lifecycle, attestation report management]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-3}
  source: ADR 0024

# Continuous control monitoring & evidence (CAP-GRC-CMP-4)
- id: FUNC-grc-continuous-control-monitoring
  term: Continuous Control Monitoring
  type: Function
  definition: Continuously tests control effectiveness across estates and surfaces failing controls.
  aliases: [CCM, control testing, control health monitoring]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-4}
  source: ADR 0024

- id: FUNC-grc-evidence-collection
  term: Evidence Collection & Reuse
  type: Function
  definition: Gathers compliance evidence (including evidence supplied by estates such as the platform) once and reuses it across obligations.
  aliases: [evidence automation, evidence repository, reusable evidence]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-4}
  source: ADR 0024

# Regulatory change & obligation management (CAP-GRC-CMP-5)
- id: FUNC-grc-regulatory-change-tracking
  term: Regulatory Change Tracking & Impact Assessment
  type: Function
  definition: Tracks changes to applicable obligations, assesses their impact, and drives control/policy updates.
  aliases: [regulatory intelligence, change impact assessment]
  relates_to:
    - {rel: supports, target: CAP-GRC-CMP-5}
  source: ADR 0024
