# ITPRA ontology — the eleven peer service domains of enterprise IT
# SHARED file: it belongs to no single service domain, so neither its name nor its ids carry a service-domain code.
# type: ServiceDomain. Ids SD-<slug>. Decided in ADR 0009.

- id: SD-IT-OPERATIONS
  term: IT Operations
  type: ServiceDomain
  definition: >
    The IT service domain that owns and operates the infrastructure platform — its control-plane foundation,
    the compute, runtime, network, and storage substrate workloads run on, provisioning and automation,
    software delivery, platform security and identity, observability and day-2 operations, resilience and
    continuity, cost and capacity, platform data services, the self-service consumer experience, and platform
    governance. The people and practices that run IT infrastructure and the services hosted on it.
  aliases: [ITO, ITOps, infrastructure and operations, I&O, IT operations and infrastructure]
  source: ADR 0009 (amended by ADR 0045, ADR 0047)

- id: SD-END-USER
  term: End-User Computing
  type: ServiceDomain
  definition: >
    The workforce computing experience — the endpoints, mobile and personally-owned devices, and virtual
    workspaces people use; the productivity and collaboration workspace; the sign-in and posture-conditioned
    access experience; end-user support and self-service; and observation of the device and the digital
    employee experience. It owns the device in the user's hands and the workspace on it; physical work at the
    desk is Field Support's, and endpoint connectivity Network & Connectivity's. TBM "End User" / "Smart
    Devices" towers.
  aliases: [end user computing, workplace services, EUC, digital workplace]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-SERVICE-DESK
  term: Service Desk
  type: ServiceDomain
  definition: >
    The single point of contact for users to report issues and raise requests — multi-channel intake;
    triage, classification, and routing across all service domains; front-line resolution and request
    handling; major-incident coordination; knowledge and self-service; and communication with the people it
    serves. It owns the contact and its front-line handling; the resolving service domains own fulfilment
    and the fix. SIAM front-line service desk.
  aliases: [help desk, support desk, single point of contact]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-FIELD-SUPPORT
  term: Onsite / Field Support
  type: ServiceDomain
  definition: >
    Hands-on, physically-present support — deskside assistance, smart hands at a site or facility, install,
    move, add, and change of equipment, and hardware break-fix and depot repair — with the dispatch, spares
    logistics, and on-site safety and access around that work. It owns the work that needs hands at a
    location, which remote action cannot perform, for whichever service domain needs it. SIAM/TBM
    distributed/on-site support.
  aliases: [field support, onsite support, deskside support, smart hands]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-APP-DEV
  term: Application Development & Maintenance
  type: ServiceDomain
  definition: >
    The teams and practices that build and maintain the business applications — application portfolio and
    lifecycle, design and engineering, quality and testing, release coordination, support and maintenance,
    developer enablement, and application performance and value insight. It owns the application as a
    product, including its application logic; the runtime, delivery pipeline, and observability the
    application is built and run on are IT Operations' (ITO-SUB, ITO-DEL, ITO-OBS). TBM "Application" / ADM.
  aliases: [ADM, application management, app dev and maintenance, business applications]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-DATACENTER
  term: Data Center & Facilities
  type: ServiceDomain
  definition: >
    The physical hosting environment — buildings and white space, power and energy distribution, cooling and
    environmental control, racks and passive cabling, physical security and access control, facility
    monitoring, and facility resilience. It owns the facility and its plant; the logical compute, network,
    and storage provisioned on the equipment it hosts are IT Operations' (ITO-SUB) and Network &
    Connectivity's. TBM "Data Center" tower.
  aliases: [datacenter, facilities, colocation, physical hosting]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-NETWORK
  term: Network & Connectivity
  type: ServiceDomain
  definition: >
    The enterprise network — corporate WAN and site connectivity, internet edge, network security and
    segmentation, site-to-site and remote secure access, naming, addressing, and DNS, quality of service,
    network observability, and network resilience — linking users, offices, data centers, and cloud. In-fabric
    networking of the infrastructure platform is IT Operations' ITO-SUB. TBM "Network".
  aliases: [enterprise network, WAN, connectivity, telecom]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-SECURITY-GRC
  term: Enterprise Security, Risk & Compliance
  type: ServiceDomain
  definition: >
    The enterprise-wide security operations and governance/risk/compliance authority — security operations
    center and threat response, the corporate identity of record and access governance, enterprise risk
    management, compliance, audit, and evidence, security policy, standards, and the control catalogue,
    security awareness, and posture reporting. It authors the guardrails and owns the enterprise registers;
    each service domain's estate implements and enforces them and supplies evidence (for the infrastructure
    platform, IT Operations' ITO-SEC). TBM "Security" + "Risk & Compliance".
  aliases: [enterprise security, GRC, SOC, risk and compliance, corporate identity]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-SERVICE-MGMT
  term: IT Service Management & Integration
  type: ServiceDomain
  definition: >
    The cross-domain management and service-integration wrapper that coordinates, governs, and assures
    multiple service providers/domains end-to-end (a service integrator / retained organization) — the
    enterprise service catalog and portfolio, cross-provider request, change, and incident and problem
    coordination, service-level and supplier management, system-of-record integration, and service
    performance and value insight. Each provider keeps its own governance constructs and records; this domain
    coordinates them across providers. The operating model it coordinates under is bound at T2. TBM "Tech
    Management" + SIAM.
  aliases: [ITSM, service management, service integration, SIAM, retained organization]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-BUSINESS-ANALYTICS
  term: Business Intelligence & Analytics
  type: ServiceDomain
  definition: >
    The business data and insight discipline — data integration/warehousing, semantic layer, reporting,
    self-service analytics, data science, data quality, master/reference data, data governance, and
    product/user behavior analytics. It owns business data governance and insight and operates no
    infrastructure: the data substrate and operational telemetry it builds on are IT Operations' Data &
    Analytics (ITO-DATA) and Observability (ITO-OBS). Product/user behavior analytics is distinct from the
    behavior analytics of security threat detection (CAP-ITO-SEC-7) and from analytics over operational
    telemetry (CAP-ITO-OBS-6). DAMA-DMBOK discipline; TBM business-analytics solution + Data tower.
  aliases: [BI, business intelligence, analytics, data analytics, product analytics]
  source: ADR 0009 (amended by ADR 0047)

- id: SD-DIGITAL-EXPERIENCE
  term: Digital Experience & Channels
  type: ServiceDomain
  definition: >
    The customer-facing digital experience discipline — composition, management, delivery, and optimization
    of contextualized digital experiences across channels (content management, personalization, customer
    journey orchestration, customer data, experimentation, digital commerce). Its consumers are external
    customers, and it owns the experience logic; the infrastructure platform that hosts it is IT
    Operations'. Distinct from Digital Experience Monitoring (CAP-ITO-OBS-9), which observes end-user
    experience.
  aliases: [digital experience, DXP, DXM, digital experience platform, digital experience management, experience management, digital channels, customer experience, omnichannel]
  source: ADR 0009 (amended by ADR 0047)
