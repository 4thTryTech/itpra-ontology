# ITPRA ontology — Data Center & Facilities (DCF) capability domains
# type: Domain. The `id` IS the domain code used in capability ids: CAP-<id>-<n> (child: CAP-<id>-<n>.<m>). Each
# domain is `grouped_by` an EXISTING capability PLANE (terms/planes.yaml). DCF capabilities are
# physical-facility-focused (buildings, power, cooling, cabling, physical security, monitoring, resilience),
# distinct from ITO's logical Infrastructure Substrate (SUB). Taxonomy ratified by ADR 0022. Owning service
# domain: SD-DATACENTER (interfaces_with PLANE-RESOURCE; see ADR 0009 + ADR 0022).

- id: DCF-SPC
  term: Facility Space & Capacity
  type: Domain
  definition: >
    The physical white-space and footprint the hosted equipment occupies — raised floor / hall space, racks
    and cabinets, the physical capacity (space, power, cooling headroom) that footprint represents, and the
    physical install/decommission of equipment into and out of the space. Owns the physical real estate the
    equipment sits in; distinct from the logical compute/storage capacity ITO SUB provisions on top.
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-DATACENTER}
  source: ADR 0022

- id: DCF-PWR
  term: Power & Energy Distribution
  type: Domain
  definition: >
    The electrical plant that delivers clean, continuous power to the hosted equipment — utility intake and
    primary supply, backup generation, uninterruptible and conditioned power, distribution to racks, and power
    metering and electrical-capacity accounting. Owns the physical electrical path; distinct from the
    platform's logical power/energy consumption accounting.
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-DATACENTER}
  source: ADR 0022

- id: DCF-COOL
  term: Cooling & Environmental Control
  type: Domain
  definition: >
    The thermal and environmental control of the white-space — heat removal and cooling provision, keeping
    temperature and humidity within a safe operating envelope at the equipment inlet, airflow management and
    aisle containment, and high-density / liquid cooling provision. Keeps the hosted equipment within a safe,
    efficient physical envelope; distinct from workload placement on the substrate.
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-DATACENTER}
  source: ADR 0022

- id: DCF-CAB
  term: Cabling & Physical Connectivity
  type: Domain
  definition: >
    The passive physical cabling plant of the facility — structured copper/fiber cabling, the pathways and
    spaces (trays, risers, conduits) that carry and protect it, and the physical cross-connects/interconnects
    where tenants and carriers physically meet. Provides the physical medium the logical network runs over;
    distinct from the logical network (the adjacent Network domain) and platform virtual networking (ITO).
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-DATACENTER}
  source: ADR 0022

- id: DCF-SEC
  term: Physical Security & Access Control
  type: Domain
  definition: >
    The physical protection of the facility and its equipment — perimeter and site security, layered
    least-privilege physical access control from boundary to rack, visitor and escort management, surveillance
    and physical intrusion detection, and physical access logging and audit evidence. Controls who physically
    reaches the equipment; distinct from logical/identity access to systems (ITO SEC and the enterprise
    security domain), to which it supplies physical-access evidence.
  relates_to:
    - {rel: grouped_by, target: PLANE-SECURITY}
    - {rel: belongs_to_service_domain, target: SD-DATACENTER}
  source: ADR 0022

- id: DCF-MON
  term: Facility Monitoring & Management
  type: Domain
  definition: >
    The operational observability and management of the physical facility (the neutral DCIM concern) —
    physical asset and inventory management, real-time environmental and power monitoring, facility capacity
    planning, energy and efficiency measurement, and facility maintenance management. Observes and manages the
    physical plant; distinct from the platform's workload/service observability (ITO OBS).
  relates_to:
    - {rel: grouped_by, target: PLANE-OPERATIONS}
    - {rel: belongs_to_service_domain, target: SD-DATACENTER}
  source: ADR 0022

- id: DCF-RES
  term: Facility Resilience & Continuity
  type: Domain
  definition: >
    The physical resilience and continuity of the hosting environment — redundancy and fault tolerance of the
    critical power/cooling systems, concurrent maintainability, hazard protection and life-safety (fire/leak
    detection and suppression), and site continuity and failover. Keeps the physical environment serving the
    hosted load through component failure, planned maintenance, and site hazards; the platform's workload
    resilience and DR (ITO) consume this physical availability and run on top.
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-DATACENTER}
  source: ADR 0022
