# ITPRA ontology — ITO-AUT (Provisioning & Automation): functions
# type: Function. Ids FUNC-ito-<slug>; a function supports one or more capabilities. Decided in ADR 0011.

# Infrastructure-as-code provisioning (CAP-ITO-AUT-1)
- id: FUNC-ito-declarative-definition-management
  term: Declarative Definition Management
  type: Function
  definition: Authors and versions the declarative definitions that describe desired infrastructure and platform state.
  aliases: [infrastructure definitions, declarative templates]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-1}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-provisioning-plan-preview
  term: Provisioning Plan Preview
  type: Function
  definition: Computes and previews the change plan (additions, changes, deletions) from a definition before it is applied.
  aliases: [change plan, plan and diff, dry run]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-1}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-infrastructure-provisioning
  term: Infrastructure Provisioning
  type: Function
  definition: Creates, updates, and tears down infrastructure resources from declarative definitions.
  aliases: [resource provisioning, infrastructure apply]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-1}
  source: ADR 0011 (amended by ADR 0045)

# Desired-state reconciliation (CAP-ITO-AUT-2)
- id: FUNC-ito-state-reconciliation
  term: State Reconciliation
  type: Function
  definition: Continuously compares actual state to declared desired state and converges actual toward it.
  aliases: [continuous reconciliation, convergence]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-2}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-drift-correction
  term: Drift Correction
  type: Function
  definition: Automatically remediates detected divergence by reapplying the declared desired state.
  aliases: [drift remediation, auto-remediation]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-2}
  source: ADR 0011 (amended by ADR 0045)

# Drift detection & reporting (CAP-ITO-AUT-3)
- id: FUNC-ito-drift-detection
  term: Drift Detection
  type: Function
  definition: >
    Detects divergence of actual state from the declared/desired state. Shared across automation
    reconciliation and the security posture-drift facet.
  aliases: [drift identification, configuration drift detection]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-3}
    - {rel: supports, target: CAP-ITO-SEC-4}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-drift-reporting
  term: Drift Reporting
  type: Function
  definition: Reports detected drift — what diverged, where, and since when — for review and remediation.
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-3}
  source: ADR 0011 (amended by ADR 0045)

# Configuration management (CAP-ITO-AUT-4)
- id: FUNC-ito-configuration-baseline-management
  term: Configuration Baseline Management
  type: Function
  definition: Defines and maintains configuration baselines that target systems are expected to conform to.
  aliases: [baseline management, configuration baselines]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-4}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-configuration-application
  term: Configuration Application
  type: Function
  definition: Applies and maintains configuration on existing targets in place to match the baseline.
  aliases: [configuration enforcement, in-place configuration]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-4}
  source: ADR 0011 (amended by ADR 0045)

# Provisioning workflow orchestration (CAP-ITO-AUT-5)
- id: FUNC-ito-workflow-orchestration
  term: Workflow Orchestration
  type: Function
  definition: >
    Coordinates multi-step workflows as dependency graphs — ordering, conditional branches, retries, and
    state — across heterogeneous systems. The general engine behind provisioning and operational workflows.
    Coordination state OUTLIVES the process holding it: a run resumes at the last completed step after the
    coordinator is lost, without re-executing completed steps. Retries recover a failed STEP; this recovers a
    failed COORDINATOR, and wording that covers only the first is satisfied by an orchestrator holding every
    run in the memory of one process. Distinct from desired-state reconciliation (CAP-ITO-AUT-2), which converges
    state with no record of progress because its actions are idempotent by construction; here an ordered,
    side-effecting sequence resumes, where re-running a step is not free (ADR 0039).
  aliases: [workflow engine, task orchestration, DAG execution, durable execution]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-5}
    - {rel: supports, target: CAP-ITO-AUT-6}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-dependency-resolution
  term: Dependency Resolution
  type: Function
  definition: Resolves and orders inter-resource dependencies so multi-step provisioning runs in a valid sequence.
  aliases: [dependency ordering, ordering resolution]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-5}
  source: ADR 0011 (amended by ADR 0045)

# Operational task orchestration (CAP-ITO-AUT-6)
- id: FUNC-ito-runbook-automation
  term: Runbook Automation
  type: Function
  definition: Executes operational runbooks on demand to perform recurring or remedial operational tasks consistently.
  aliases: [operational automation, automated runbooks]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-6}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-event-triggered-execution
  term: Event-Triggered Execution
  type: Function
  definition: Triggers OR RESUMES workflows/tasks in response to events (signals, messages, state changes) rather than a fixed schedule. An event may start new work, or deliver a signal to an execution that is already waiting for it - which then continues at the awaiting step with the payload intact, rather than beginning again (ADR 0039).
  aliases: [event-driven automation, trigger-based execution, signal delivery, external event resumption]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-6}
  source: ADR 0011 (amended by ADR 0045)

# Scheduled job execution (CAP-ITO-AUT-7)
- id: FUNC-ito-job-scheduling
  term: Job Scheduling
  type: Function
  definition: >
    Schedules recurring jobs on a time/calendar basis. The recurring-execution family shared across
    automation, platform patch windows, and backup schedules. Also reaches a ONE-SHOT timer INSIDE a running
    execution: a run may suspend on a timer of arbitrary length — minutes or months — and wake inside itself
    at the step that suspended, rather than being re-triggered from outside as a new run (ADR 0039).
  aliases: [cron scheduling, recurring scheduling, time-based scheduling, in-run timer, durable timer]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-7}
    - {rel: supports, target: CAP-ITO-OBS-5}
    - {rel: supports, target: CAP-ITO-RES-1}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-job-execution-tracking
  term: Job Execution Tracking
  type: Function
  definition: >
    Executes scheduled job runs and tracks their outcomes, durations, and failures for follow-up. Scope
    reaches a run's STEP-LEVEL record - inputs, outputs, attempts, timings, and the principal each step acted
    for - and that record is what recovery reads to resume a run rather than restart it. Distinct in
    obligation from the telemetry trace of the same run (CAP-ITO-OBS-1) - the record is sufficient to RESUME, the
    trace is sufficient to EXPLAIN, and neither substitutes for the other (ADR 0039).
  aliases: [job run tracking, execution history, step record, run journal]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-7}
  source: ADR 0011 (amended by ADR 0045)

# Configuration lifecycle
- id: FUNC-ito-configuration-templating
  term: Configuration Templating
  type: Function
  definition: >
    Composes configurations from reusable, parameterized building blocks — templates, fragments, and
    overlays instantiated with per-context values — so common structure is defined once and specialized
    per target.
  aliases: [configuration composition, parameterized configuration]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-4}
    - {rel: supports, target: CAP-ITO-FND-1}
    - {rel: supports, target: CAP-ITO-OBS-11}
  source: ADR 0032 (amended by ADR 0045)

- id: FUNC-ito-configuration-validation
  term: Configuration Validation
  type: Function
  definition: >
    Validates a configuration artifact before it is applied — syntax, schema, and load checks, including
    dry-run evaluation — so invalid configuration is rejected prior to distribution rather than at the
    target.
  aliases: [config dry run, pre-apply validation]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-4}
    - {rel: supports, target: CAP-ITO-OBS-11}
  source: ADR 0032 (amended by ADR 0045)

- id: FUNC-ito-tool-invocation-mediation
  term: Tool Invocation Mediation
  type: Function
  definition: Dispatches a call the executing actor selected at runtime to an external tool or capability, applies the automation boundary to that specific call, and returns the result into the actor's context.
  aliases: [tool calling, function calling, tool use, tool dispatch]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-8}
  source: ADR 0033 (amended by ADR 0045)

- id: FUNC-ito-mcp-tool-interoperability
  term: Standardized Tool-Interoperability Protocol
  type: Function
  definition: Exposes and consumes tools, and the resources an actor can discover and read (descriptive and semantic content such as a published vocabulary), over a standardized, independently governed wire protocol so the same tool or resource is reachable across agent implementations without bespoke per-agent integration. Named-standard function (Model Context Protocol) minted under the ADR 0032 precedent - the standard is under independent foundation governance with a published specification and change process. A protocol change is a definition edit, not a re-mint.
  aliases: [MCP, Model Context Protocol, tool protocol, agent tool interoperability]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-8}
  source: ADR 0033 (amended by ADR 0045)

- id: FUNC-ito-agent-execution-sandboxing
  term: Agent Execution Sandboxing
  type: Function
  definition: Provisions isolated, ephemeral compute for an actor-initiated action or session and tears it down afterwards, so a runtime-selected action cannot reach beyond its own execution boundary.
  aliases: [ephemeral sandbox, per-invocation isolation, agent sandbox]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-8}
    - {rel: supports, target: CAP-ITO-SUB-1}
  source: ADR 0033 (amended by ADR 0045)

- id: FUNC-ito-inflight-run-control
  term: In-Flight Run Control
  type: Function
  definition: Exposes a control point on a running actor execution so it can be observed, paused, redirected, or terminated before it completes, without waiting for the run to finish.
  aliases: [pause and steer, run interruption, kill switch, intervention point]
  relates_to:
    - {rel: supports, target: CAP-ITO-AUT-8}
  source: ADR 0033 (amended by ADR 0045)
# In-flight version compatibility
- id: FUNC-ito-execution-version-compatibility
  term: Execution Version Compatibility
  type: Function
  definition: >
    Keeps executions that are already open runnable when the definition, or the code beneath it, changes:
    every open execution either continues on a version able to complete it, or is explicitly drained,
    migrated, or terminated, and no version with open executions is decommissioned silently. The obligation
    is a standing duty on the release owner rather than a release-time check, because it persists for as long
    as any run against a superseded version remains open. Whether the mechanism pins, patches, drains, or
    migrates - and how long a superseded version stays runnable - is a scenario decision (ADR 0039).
  aliases: [in-flight version compatibility, open-run compatibility, worker version compatibility, pin and drain]
  relates_to:
    - {rel: supports, target: CAP-ITO-DEL-4}
    - {rel: supports, target: CAP-ITO-AUT-5}
    - {rel: supports, target: CAP-ITO-AUT-6}
    - {rel: supports, target: CAP-ITO-AUT-9}
  source: ADR 0039 (amended by ADR 0045)
