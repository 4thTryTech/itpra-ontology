# ITPRA ontology — ITO-COST (Cost & Capacity): capabilities
# type: Capability. Ids CAP-ITO-COST-<n>, each grouped under ITO-COST. Decided in ADR 0017.

- id: CAP-ITO-COST-1
  term: Cost Attribution & Showback
  type: Capability
  definition: >
    Attributes resource consumption and cost to tenants and services, making spend transparent and
    chargeable/showable to those who incur it. Token and inference spend follows this same
    consumption-to-attribution pattern and is in scope here: the unit differs, the capability does not
    (metered by FUNC-ito-token-usage-metering at the model gateway, CAP-ITO-SUB-8; ADR 0033).
  relates_to:
    - {rel: grouped_by, target: ITO-COST}
    - {rel: depends_on, target: CAP-ITO-OBS-1}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-platform-consumer}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-COST-2
  term: Capacity Planning
  type: Capability
  definition: >
    Reports current and forecast capacity against demand, so the platform can stay ahead of growth without
    over-provisioning.
  relates_to:
    - {rel: grouped_by, target: ITO-COST}
    - {rel: depends_on, target: CAP-ITO-OBS-1}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-COST-3
  term: Optimization Recommendations
  type: Capability
  definition: >
    Surfaces optimization opportunities for cost and utilization, identifying waste and right-sizing
    actions for decision-makers to act on.
  relates_to:
    - {rel: grouped_by, target: ITO-COST}
    - {rel: depends_on, target: CAP-ITO-COST-1}
    - {rel: depends_on, target: CAP-ITO-COST-2}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
  source: ADR 0017 (amended by ADR 0045)
