# ITPRA ontology — environment dimensions: the hosting axes a capability's outcome holds across
# SHARED file: it belongs to no single service domain, so neither its name nor its ids carry a service-domain code.
# type: Concept. Ids ENV-DIM-<SLUG>. Decided in ADR 0014.

- id: ENV-DIM-HOSTING
  term: Hosting model
  type: Concept
  definition: >
    The environment dimension describing where the infrastructure platform and its workloads are hosted.
    Allowed values: public (public cloud), private (private cloud / on-prem), hybrid (a managed combination).
    A T1 capability's outcome must hold across all values; how it is realized may vary, in which case hosting
    is a variation point bound at T2/T3 (e.g. provider integration, network/identity model).
  aliases: [deployment locus, hosting locus]
  relates_to:
    - {rel: applies_to, target: ENVIRONMENT}
  source: ADR 0014 (amended by ADR 0047)

- id: ENV-DIM-WORKLOAD
  term: Workload form
  type: Concept
  definition: >
    The environment dimension describing the form workloads take on the substrate. Allowed values:
    container, VM (virtual machine), serverless (event-driven, provider-managed runtime with no
    consumer-managed host). A T1 capability's outcome must hold across these forms; where realization
    differs (e.g. packaging, isolation primitive, lifecycle, degree of host management), workload form is a
    variation point bound at T2/T3.
  aliases: [workload type, runtime form, compute model]
  relates_to:
    - {rel: applies_to, target: ENVIRONMENT}
  source: ADR 0014
