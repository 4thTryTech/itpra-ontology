# ITPRA ontology — Application Development & Maintenance (ADM): personas
# type: Persona. Ids PERSONA-adm-<slug>. Decided in ADR 0021.

- id: PERSONA-adm-app-team
  term: Application Engineering Team
  type: Persona
  definition: >
    The provider: a stream-aligned team that builds, maintains, and operates a business application as a
    product — owning its design, implementation, integration, quality, release coordination, and maintenance
    across the application's life. The primary owner of the ADM capabilities. Consumes the infrastructure
    platform's paved roads and runtime rather than owning them. At T2/T3 this refines into granular roles
    (application developer/engineer, application architect, integration engineer, application data engineer,
    tech lead).
  aliases: [stream-aligned team, application team, product engineering team, dev team]
  source: ADR 0021 (amended by ADR 0047)

- id: PERSONA-adm-business-owner
  term: Application Business Owner
  type: Persona
  definition: >
    The demand/consumer: the business or product owner who sponsors an application, owns its intent and
    priorities, and consumes the value it delivers — framing demand, funding, and the outcomes the
    application must achieve. Consumes ADM capabilities (portfolio, value insight) rather than owning them.
    At T2/T3 this refines into granular roles (product owner, business sponsor, portfolio manager, business
    analyst).
  aliases: [product owner, business sponsor, application sponsor, portfolio owner]
  source: ADR 0021

- id: PERSONA-adm-app-support
  term: Application Support Specialist
  type: Persona
  definition: >
    The assistance owner: resolves application-level issues across escalating tiers and operates the
    application's support model day to day — triage, workaround, diagnosis, and escalation to engineering for
    code-level fixes. Distinct from the cross-domain Service Desk contact channel; this is the
    application-resolution role. At T2/T3 this refines into granular roles (application support analyst,
    application maintenance engineer, hypercare lead).
  aliases: [application support, app maintenance support, production support, application analyst]
  source: ADR 0021

- id: PERSONA-adm-app-assurance
  term: Application Quality & Assurance
  type: Persona
  definition: >
    The assurance owner: defines and verifies the application's quality bar and compliance posture, owns the
    testing strategy and the readiness gate, and supplies application-quality evidence. Applies the
    enterprise quality and compliance expectations to the application rather than authoring the enterprise
    catalog. At T2/T3 this refines into granular roles (quality engineer, test lead, application compliance
    liaison, release-assurance owner).
  aliases: [QA, quality engineering, application assurance, test lead]
  source: ADR 0021

- id: PERSONA-adm-model-grounded-engineer
  term: Model-Grounded Application Engineer
  type: Persona
  definition: >
    The builder of inference-time behaviour: designs how a model-grounded component behaves, curates the
    context it is given, sets its guardrails, and evaluates it against a statistical rather than pass/fail
    bar. Defined by RESPONSIBILITY, not by market job title - the titles in this space are unsettled and
    T1 stays neutral to them. A specialization of the application engineering team rather than a separate
    organization; at T2/T3 it refines into granular roles. Human role: the non-human actor it builds and
    delegates to is AUTON-ACTOR, a Concept and deliberately not a persona (ADR 0030).
  aliases: [AI engineer, GenAI engineer, agent developer, applied AI engineer]
  source: ADR 0034

- id: PERSONA-adm-ai-assurance
  term: AI Evaluation & Assurance Specialist
  type: Persona
  definition: >
    The evaluation owner for non-deterministic behaviour: curates reference cases, calibrates automated
    scoring against expert judgement and keeps that agreement measured over time, runs adversarial testing,
    and supplies the evidence that gates release. Separated from the general assurance role
    (PERSONA-adm-app-assurance) on COMPETENCE rather than responsibility - the responsibility is the same
    quality bar, but maintaining a scorer whose agreement with experts is itself a measured, decaying
    quantity is a different practice from designing deterministic tests. The weaker of the two personas
    minted here and a deliberate consolidation candidate as the market settles (ADR 0034).
  aliases: [eval engineer, AI quality specialist, model evaluation lead, red-team lead]
  source: ADR 0034
