# ITPRA ontology — ADM-ENG (Application Build & Engineering Practice) capabilities
# type: Capability. ids CAP-ADM-ENG-<n>. Grouped under domain ADM-ENG (ADR 0021). CONSUMER-side: builds the
# application; consumes the platform's software-delivery pipeline (ITO-DEL), does not own it (ADR 0021).

- id: CAP-ADM-ENG-1
  term: Application Design & Architecture
  type: Capability
  definition: >
    Designs the structure and behavior of an application — its components, interfaces, data, and the patterns
    it follows — so it meets its functional intent and quality bar and fits the platform it will run on,
    before and during implementation.
    Designing a multi-step, side-effecting sequence includes designing its recovery and reversal: step boundaries,
    which steps may safely re-execute, how a partially completed sequence is unwound, and how the definition
    changes while runs against it are open (ADR 0039).
  relates_to:
    - {rel: grouped_by, target: ADM-ENG}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0021 (amended by ADR 0039)

- id: CAP-ADM-ENG-2
  term: Application Implementation & Source Management
  type: Capability
  definition: >
    Implements application logic and manages its source — authoring, reviewing, versioning, and curating the
    codebase as the maintainable record of the application — so change is traceable, reviewable, and
    reversible. The record includes the non-code artifacts that shape inference-time behaviour —
    instructions, context configurations, and model bindings — which are versioned alongside source rather
    than managed separately (FUNC-adm-inference-artifact-versioning; ADR 0034).
  relates_to:
    - {rel: grouped_by, target: ADM-ENG}
    - {rel: depends_on, target: CAP-ADM-ENG-1}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0021

- id: CAP-ADM-ENG-3
  term: Application Integration & Interface Engineering
  type: Capability
  definition: >
    Engineers how the application connects to other applications and services — its interfaces, contracts,
    and integration points — so it interoperates dependably across the portfolio and with external systems.
    Consumers include non-human ones: an interface may need to be discoverable and reliably usable by a
    delegated actor (AUTON-ACTOR), not only by a human developer. That concern is in scope here as an
    interface-design consideration, carried as an alias rather than minted as its own term while the
    market vocabulary is single-sourced (ADR 0009 §4; ADR 0034).
    Once-only effects at an outbound boundary are the caller's obligation; a runtime that guarantees forward
    progress does not discharge them when the step that made the call is retried (ADR 0039).
  aliases: [agent experience, AX, machine-consumable interface design]
  relates_to:
    - {rel: grouped_by, target: ADM-ENG}
    - {rel: depends_on, target: CAP-ADM-ENG-1}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0021 (amended by ADR 0039)

- id: CAP-ADM-ENG-4
  term: Application Packaging & Configuration
  type: Capability
  definition: >
    Packages the application into a deployable, parameterized form and externalizes its configuration per
    environment — so the same artifact promotes consistently across environments via the consumed platform
    delivery path, without per-environment rebuilds.
  relates_to:
    - {rel: grouped_by, target: ADM-ENG}
    - {rel: depends_on, target: CAP-ADM-ENG-2}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0021

- id: CAP-ADM-ENG-5
  term: Application Data & Schema Engineering
  type: Capability
  definition: >
    Designs and evolves the application's own data model and schema — including versioned schema change and
    data migration — so application data stays correct and the application can evolve without data loss.
    Distinct from enterprise data management owned by the analytics/data domain.
  relates_to:
    - {rel: grouped_by, target: ADM-ENG}
    - {rel: depends_on, target: CAP-ADM-ENG-1}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0021

- id: CAP-ADM-ENG-6
  term: Model-Grounded Behaviour Engineering
  type: Capability
  definition: >
    Designs and builds the application behaviour that is generated at inference time by a hosted model
    rather than written as deterministic logic - decomposing the system into model-grounded and
    deterministic components and defining how they coordinate, specifying what context the model-grounded
    component may see at inference time, and setting the application-side policy for which model a task is
    routed to. A member of ADM-ENG rather than a separate group: this is application engineering, in the
    same sense that evaluating it is application testing. Consumes the platform's model-provider gateway
    (CAP-ITO-SUB-8) rather than owning it. Coordination topologies, context budgets, and provider choice
    bind at T2/T3.
  aliases: [AI engineering, GenAI application engineering, agentic application development, inference-time behaviour design]
  relates_to:
    - {rel: grouped_by, target: ADM-ENG}
    - {rel: depends_on, target: CAP-ADM-ENG-1}
    - {rel: consumed_by, target: PERSONA-adm-model-grounded-engineer}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0034

- id: CAP-ADM-ENG-7
  term: Autonomous-Behaviour Guardrail Design
  type: Capability
  definition: >
    Defines the behavioural, tool-use, and privilege boundaries within which an application's model-grounded
    or autonomous actions may operate, and builds their enforcement into the application itself. Sits with
    the builder because a guardrail is part of the application's own behaviour, the same reasoning that
    keeps application testing in ADM-QAT rather than moving it to the enterprise control catalogue. Distinct
    from EVALUATING whether the guardrail works, which is offline and sampled (CAP-ADM-QAT-6), and from the
    platform's runtime enforcement of the automation boundary (CAP-ITO-AUT-8). The enterprise standard for
    what guardrails must cover is authored elsewhere and consumed here. Governed semantic constraints - the
    governing semantic model's rules (CAP-BIA-GOV-7) - are one source of guardrail rules, so an actor's
    output can be checked against the meaning it claims to use before it is returned or acted on
    (answer-time conformance; ADR 0031).
    Where a call site is chosen at runtime, no authoring site exists to attach an idempotency key, so bounding
    duplicate effects is guardrail work (ADR 0039).
  aliases: [guardrails, behavioural boundaries, agent safety design, tool-use boundaries]
  relates_to:
    - {rel: grouped_by, target: ADM-ENG}
    - {rel: depends_on, target: CAP-ADM-ENG-6}
    - {rel: consumed_by, target: PERSONA-adm-model-grounded-engineer}
    - {rel: consumed_by, target: PERSONA-adm-app-team}
  source: ADR 0034 (amended by ADR 0039)
