# ITPRA ontology — BIA-INT (Data Integration & Ingestion): capabilities
# type: Capability. Ids CAP-BIA-INT-<n>, each grouped under BIA-INT. Decided in ADR 0026.

- id: CAP-BIA-INT-1
  term: Batch Data Ingestion
  type: Capability
  definition: >
    Acquires business data from source systems on a scheduled or triggered batch cadence and lands it in the
    analytical estate reliably, with managed retries and completeness checks, so source data arrives intact
    for downstream modeling.
  relates_to:
    - {rel: grouped_by, target: BIA-INT}
    - {rel: consumed_by, target: PERSONA-bia-analytics-team}
  source: ADR 0026

- id: CAP-BIA-INT-2
  term: Streaming & Real-Time Ingestion
  type: Capability
  definition: >
    Ingests business events and data as a continuous stream for low-latency analytics, consuming the
    infrastructure platform's managed streaming substrate, so time-sensitive insight reflects current state.
  relates_to:
    - {rel: grouped_by, target: BIA-INT}
    - {rel: consumed_by, target: PERSONA-bia-analytics-team}
  source: ADR 0026 (amended by ADR 0047)

- id: CAP-BIA-INT-3
  term: Change-Data Capture & Replication
  type: Capability
  definition: >
    Detects and propagates incremental changes from operational source systems into the analytical estate,
    keeping analytical copies current without full reloads and preserving an auditable change history.
  relates_to:
    - {rel: grouped_by, target: BIA-INT}
    - {rel: depends_on, target: CAP-BIA-INT-1}
    - {rel: consumed_by, target: PERSONA-bia-analytics-team}
  source: ADR 0026

- id: CAP-BIA-INT-4
  term: Data Transformation & Pipeline Orchestration
  type: Capability
  definition: >
    Transforms, cleanses, and conforms ingested data through managed, scheduled pipelines with dependency
    orchestration, so raw source data becomes consistent, analysis-ready data on a reliable cadence.
  relates_to:
    - {rel: grouped_by, target: BIA-INT}
    - {rel: depends_on, target: CAP-BIA-INT-1}
    - {rel: consumed_by, target: PERSONA-bia-analytics-team}
  source: ADR 0026

- id: CAP-BIA-INT-5
  term: Data Virtualization & Federation
  type: Capability
  definition: >
    Provides governed query-time access to data that remains in place across multiple sources — federating
    or virtualizing it without physically moving every dataset — so consumers reach distributed business data
    through one logical access surface.
  relates_to:
    - {rel: grouped_by, target: BIA-INT}
    - {rel: consumed_by, target: PERSONA-bia-analytics-team}
    - {rel: consumed_by, target: PERSONA-bia-data-scientist}
  source: ADR 0026
