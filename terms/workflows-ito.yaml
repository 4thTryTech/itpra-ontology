# ITPRA ontology — IT Operations (ITO) workflow catalog
# type: Workflow. ids WF-ito-<slug> (zero or more per journey). The Mermaid diagrams that render the journeys;
# each is `realized_in` exactly one ITO journey (JRN-ito-<slug>). Neutral — diagrams use capability ids + neutral
# construct points (request/approval/change/incident/record), no tools or named processes. Ratified vehicle: ADR
# 0013; the `ito` code by ADR 0045.

- id: WF-ito-onboard-consumer
  term: Onboard a Consumer Team & Tenant (diagram)
  type: Workflow
  definition: Flow diagram of the consumer/tenant onboarding journey.
  relates_to:
    - {rel: realized_in, target: JRN-ito-onboard-consumer}
  source: ADR 0013 (amended by ADR 0045)

