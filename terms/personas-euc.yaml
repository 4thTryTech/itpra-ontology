# ITPRA ontology — End-User Computing (EUC): personas
# type: Persona. Ids PERSONA-euc-<slug>. Decided in ADR 0018.

- id: PERSONA-euc-workforce-user
  term: Workforce User
  type: Persona
  definition: >
    The consumer of end-user computing: any employee, contractor, or workforce member who uses a managed or
    personal device, a workspace, and productivity tooling to do their job — the primary customer of the EUC
    service domain. At T2/T3 this refines into segments (knowledge worker, frontline/deskless worker, mobile/
    field worker, executive, contractor/guest).
  aliases: [employee, end user, workforce member, knowledge worker]
  source: ADR 0018

- id: PERSONA-euc-workplace-team
  term: Workplace Engineering Team
  type: Persona
  definition: >
    The provider: builds, operates, and evolves the end-user computing service as a product — the device
    fleet, workspace and productivity services, virtual workspaces, endpoint posture, and the support
    experience. Owns the EUC capabilities, golden-path device/workspace experiences, and the digital-
    experience roadmap. At T2/T3 this refines into granular roles (endpoint engineer, workspace/collaboration
    engineer, virtualization engineer, mobility engineer, EUC product owner, DEX analyst).
  aliases: [EUC team, digital workplace team, endpoint engineering, workplace services]
  source: ADR 0018

- id: PERSONA-euc-support-agent
  term: End-User Support Agent
  type: Persona
  definition: >
    The assistance owner: helps workforce users resolve workplace issues and fulfils workplace requests —
    operating self-service deflection, remote assistance and remediation, and onboarding/offboarding actions.
    Distinct from the cross-domain Service Desk contact channel; this is the workplace-resolution role. At
    T2/T3 this refines into granular roles (Level 1/Level 2 endpoint support, remote-support technician,
    onboarding coordinator).
  aliases: [workplace support, deskside support, end-user support, L1/L2 endpoint support]
  source: ADR 0018

- id: PERSONA-euc-security-compliance
  term: Workplace Security & Compliance
  type: Persona
  definition: >
    The assurance owner for the workplace: defines and verifies the endpoint security and compliance posture
    applied to the workforce estate, consumes endpoint compliance evidence, and sets the device-posture and
    access guardrails users operate within. Applies enterprise policy to endpoints rather than authoring the
    enterprise control catalog. At T2/T3 this refines into granular roles (endpoint security engineer,
    compliance/audit liaison, BYOD policy owner).
  aliases: [endpoint security, workplace compliance, device compliance owner]
  source: ADR 0018
