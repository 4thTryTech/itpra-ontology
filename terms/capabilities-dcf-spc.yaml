# ITPRA ontology — DCF-SPC (Facility Space & Capacity) capabilities
# type: Capability. ids CAP-DCF-SPC-<n>. Grouped under domain DCF-SPC (ADR 0022); environment expression per ADR
# 0014.

- id: CAP-DCF-SPC-1
  term: White-Space & Floor Provision
  type: Capability
  definition: >
    Provides conditioned, equipment-ready physical white-space — the floor/hall area, structural support, and
    raised-floor or slab layout into which hosted equipment is placed — so there is suitable, safe physical
    real estate for the load to occupy.
  relates_to:
    - {rel: grouped_by, target: DCF-SPC}
    - {rel: consumed_by, target: PERSONA-dcf-facility-tenant}
    - {rel: consumed_by, target: PERSONA-dcf-facilities-team}
  source: ADR 0022

- id: CAP-DCF-SPC-2
  term: Rack & Cabinet Provision
  type: Capability
  definition: >
    Provides and assigns the racks, cabinets, and enclosures that house hosted equipment — including their
    physical mounting, securing, and position in the layout — as the unit of physical footprint a tenant
    occupies.
  relates_to:
    - {rel: grouped_by, target: DCF-SPC}
    - {rel: depends_on, target: CAP-DCF-SPC-1}
    - {rel: consumed_by, target: PERSONA-dcf-facility-tenant}
    - {rel: consumed_by, target: PERSONA-dcf-facilities-team}
  source: ADR 0022

- id: CAP-DCF-SPC-3
  term: Physical Capacity Management
  type: Capability
  definition: >
    Maintains and allocates the facility's physical capacity envelope — usable space, available power, and
    cooling headroom per area/rack — so footprint is assigned within physical limits and stranded or exhausted
    capacity is avoided. The physical counterpart to the platform's logical capacity (ITO SUB).
  relates_to:
    - {rel: grouped_by, target: DCF-SPC}
    - {rel: depends_on, target: CAP-DCF-SPC-2}
    - {rel: consumed_by, target: PERSONA-dcf-facilities-team}
    - {rel: consumed_by, target: PERSONA-dcf-facility-tenant}
  source: ADR 0022

- id: CAP-DCF-SPC-4
  term: Equipment Install & Decommission
  type: Capability
  definition: >
    Physically onboards equipment into the facility (receiving, racking, mounting, power/cable connection,
    bring-up) and offboards it at end of life (de-cabling, de-racking, removal, space reclamation), so the
    physical footprint is correctly populated and cleanly reclaimed.
  relates_to:
    - {rel: grouped_by, target: DCF-SPC}
    - {rel: depends_on, target: CAP-DCF-SPC-2}
    - {rel: consumed_by, target: PERSONA-dcf-facilities-team}
    - {rel: consumed_by, target: PERSONA-dcf-facility-tenant}
  source: ADR 0022
