# ITPRA ontology — ITO-FND (Platform Foundation): functions
# type: Function. Ids FUNC-ito-<slug>; a function supports one or more capabilities. Decided in ADR 0011.

# Platform configuration source of truth (CAP-ITO-FND-1)
- id: FUNC-ito-version-control
  term: Version Control
  type: Function
  definition: Stores configuration and definitions with full, reviewable history and the ability to compare versions.
  aliases: [versioning, source control, change history]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-1}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-change-review
  term: Change Review
  type: Function
  definition: Reviews and approves proposed changes to configuration/definitions before they are accepted into the source of truth.
  aliases: [peer review, merge review]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-1}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-configuration-rollback
  term: Configuration Rollback
  type: Function
  definition: Reverts configuration/definitions to a known-good prior version.
  aliases: [config revert, version rollback]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-1}
  source: ADR 0011 (amended by ADR 0045)

# Secrets management (CAP-ITO-FND-2)
- id: FUNC-ito-secret-storage
  term: Secret Storage
  type: Function
  definition: Stores secrets and credentials encrypted at rest in a centralized, access-controlled store.
  aliases: [secret vaulting, credential storage]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-2}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-secret-distribution
  term: Secret Distribution
  type: Function
  definition: Delivers secrets to authorized consumers at runtime without exposing them in plaintext at rest or in definitions.
  aliases: [secret injection, credential delivery]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-2}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-secret-rotation
  term: Secret Rotation
  type: Function
  definition: Rotates and revokes secrets on a schedule or event, favoring short-lived/ephemeral credentials.
  aliases: [credential rotation, secret revocation]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-2}
  source: ADR 0011 (amended by ADR 0045)

# Artifact & image registry (CAP-ITO-FND-3)
- id: FUNC-ito-artifact-storage
  term: Artifact Storage
  type: Function
  definition: Stores deployable artifacts and images in a versioned, access-controlled registry.
  aliases: [artifact repository, image storage]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-3}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-artifact-versioning
  term: Artifact Versioning
  type: Function
  definition: Versions and tags artifacts/images so each deployable unit is unambiguously identified and retrievable.
  aliases: [artifact tagging, image versioning]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-3}
  source: ADR 0011 (amended by ADR 0045)

# Policy-as-code evaluation (CAP-ITO-FND-4)
- id: FUNC-ito-policy-authoring
  term: Policy Authoring
  type: Function
  definition: Expresses platform policy as versioned code so it can be reviewed, tested, and evaluated.
  aliases: [policy-as-code authoring, rule authoring]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-4}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-policy-evaluation
  term: Policy Evaluation
  type: Function
  definition: >
    Evaluates codified policy against a proposed change and returns pass/fail with rationale. Shared across
    change-time policy-as-code evaluation and security admission (which consumes the decision to enforce).
  aliases: [policy decision, compliance evaluation]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-4}
    - {rel: supports, target: CAP-ITO-SEC-5}
  source: ADR 0011 (amended by ADR 0045)

# Platform provenance & component inventory (CAP-ITO-FND-5)
- id: FUNC-ito-component-inventory
  term: Component Inventory
  type: Function
  definition: Maintains an authoritative inventory of the platform's own components and their versions.
  aliases: [SBOM, software bill of materials, component manifest]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-5}
  source: ADR 0011 (amended by ADR 0045)

- id: FUNC-ito-provenance-tracking
  term: Provenance Tracking
  type: Function
  definition: Records the origin of each component — where it came from and which definition/build produced it.
  aliases: [provenance recording, build provenance]
  relates_to:
    - {rel: supports, target: CAP-ITO-FND-5}
  source: ADR 0011 (amended by ADR 0045)
