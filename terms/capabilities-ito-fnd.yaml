# ITPRA ontology — ITO-FND (Platform Foundation) capabilities
# type: Capability. ids CAP-ITO-FND-<n>. Grouped under domain ITO-FND (ADR 0017); environment expression per
# ADR 0014.
# relates_to targets must resolve to ontology term ids.

- id: CAP-ITO-FND-1
  term: Platform Configuration Source of Truth
  type: Capability
  definition: >
    A single, versioned, declarative source of truth for all platform configuration and definitions, with
    full history, review, and rollback — the authoritative desired state the platform reconciles toward.
  relates_to:
    - {rel: grouped_by, target: ITO-FND}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-FND-2
  term: Secrets Management
  type: Capability
  definition: >
    Secure storage, controlled distribution, rotation, and revocation of secrets and credentials so they
    are never exposed in plaintext at rest, in transit, or in definitions.
  relates_to:
    - {rel: grouped_by, target: ITO-FND}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-platform-consumer}
    - {rel: consumed_by, target: PERSONA-ito-security-compliance}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-FND-3
  term: Artifact & Image Registry
  type: Capability
  definition: >
    A versioned, access-controlled registry of artifacts and images for the platform and its tenants,
    serving as the authoritative store of deployable units and their versions.
  relates_to:
    - {rel: grouped_by, target: ITO-FND}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-platform-consumer}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-FND-4
  term: Policy-as-Code Evaluation
  type: Capability
  definition: >
    Expresses platform policy as versioned code and evaluates it against proposed changes before they take
    effect, returning pass/fail with rationale. (Runtime admission/enforcement is ITO-SEC; this is the
    change-time evaluation of codified policy.)
  relates_to:
    - {rel: grouped_by, target: ITO-FND}
    - {rel: depends_on, target: CAP-ITO-FND-1}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-security-compliance}
  source: ADR 0017 (amended by ADR 0045)

- id: CAP-ITO-FND-5
  term: Platform Provenance & Component Inventory
  type: Capability
  definition: >
    Records the provenance and version of every platform component the platform runs — what it is, where it
    came from, and which definition produced it — as an authoritative inventory of the platform's own state.
  relates_to:
    - {rel: grouped_by, target: ITO-FND}
    - {rel: depends_on, target: CAP-ITO-FND-1}
    - {rel: depends_on, target: CAP-ITO-FND-3}
    - {rel: consumed_by, target: PERSONA-ito-platform-team}
    - {rel: consumed_by, target: PERSONA-ito-security-compliance}
  source: ADR 0017 (amended by ADR 0045)
