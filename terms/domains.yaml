# ITPRA ontology — T1 capability domains
# The domains capabilities are grouped under. Ratified by ADR 0017. The `id` IS the domain code used in
# capability ids: CAP-<id>-<n> (child: CAP-<id>-<n>.<m>). Each domain is itself `grouped_by` a capability PLANE
# (ADR 0010; see terms/planes.yaml).

- id: FND
  term: Platform Foundation
  type: Domain
  definition: >
    The platform's own backbone — version control / source of truth, secrets management, artifact &
    registry, policy-as-code, and platform configuration.
  relates_to:
    - {rel: grouped_by, target: PLANE-FOUNDATION}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: SUB
  term: Infrastructure Substrate
  type: Domain
  definition: >
    The compute, runtime, network, DNS, storage, and load-balancing resources workloads run on — neutral
    to VM/container and to public/private/hybrid.
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: AUT
  term: Provisioning & Automation
  type: Domain
  definition: >
    Realizing desired state — infrastructure-as-code, configuration management, declarative reconciliation,
    drift control, and workflow orchestration.
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: DEL
  term: Software Delivery
  type: Domain
  definition: >
    Building, testing, packaging, deploying, releasing, and promoting services onto the platform, including
    supply-chain integrity.
  relates_to:
    - {rel: grouped_by, target: PLANE-DELIVERY}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: SEC
  term: Security & Identity
  type: Domain
  definition: >
    Authentication/authorization, identity federation and workload identity, PKI, policy enforcement /
    admission, vulnerability and threat management, and secrets governance.
  relates_to:
    - {rel: grouped_by, target: PLANE-SECURITY}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: OBS
  term: Observability & Operations
  type: Domain
  definition: >
    Metrics, logs, traces, and events; alerting, dashboards, and SLO management; day-2 operations,
    patching, and incident/restore handling.
  relates_to:
    - {rel: grouped_by, target: PLANE-OPERATIONS}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: RES
  term: Resilience & Continuity
  type: Domain
  definition: >
    Backup, restore, disaster recovery, high availability, and capacity resilience.
  relates_to:
    - {rel: grouped_by, target: PLANE-OPERATIONS}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: COST
  term: Cost & Capacity
  type: Domain
  definition: >
    Cost visibility (showback/chargeback), capacity planning, and optimization.
  relates_to:
    - {rel: grouped_by, target: PLANE-OPERATIONS}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: DATA
  term: Data & Analytics
  type: Domain
  definition: >
    Data and analytics services for the platform and IT services — managed data stores, lake/warehouse/
    lakehouse, streaming/eventing, pipelines (ETL/ELT), query/analytics engines, and BI/visualization
    tooling for platform and IT-service insight — together with data governance (classification, lineage,
    retention, residency). Feeds to an enterprise data lake or business BI are treated as boundary
    integrations, detailed in derived tiers if/when needed.
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: EXP
  term: Consumer Experience
  type: Domain
  definition: >
    The interface plane — self-service portal, service catalog, golden paths / paved roads, APIs and CLIs,
    documentation, and onboarding.
  relates_to:
    - {rel: grouped_by, target: PLANE-EXPERIENCE}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017

- id: GOV
  term: Governance & Service Management
  type: Domain
  definition: >
    Operating-model-neutral constructs — request, approval/change, incident/problem, system-of-record, and
    service levels — plus multi-tenancy governance, lifecycle/decommission, compliance & audit evidence,
    and platform measurement & insight (usage, adoption, value, and decision metrics). Operating-model
    mapping (ITIL / DevOps) happens at T2.
  relates_to:
    - {rel: grouped_by, target: PLANE-GOVERNANCE}
    - {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
  source: ADR 0017
