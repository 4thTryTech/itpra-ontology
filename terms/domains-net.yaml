# ITPRA ontology — Network & Connectivity (NET) capability domains
# type: Domain. The `id` IS the domain code used in capability ids: CAP-<id>-<n> (child: CAP-<id>-<n>.<m>). Each
# domain is `grouped_by` an EXISTING capability PLANE (terms/planes.yaml). NET capabilities span planes; each
# group is placed under the fitting existing plane. Taxonomy ratified by ADR 0023. Owning service domain:
# SD-NETWORK (interfaces_with PLANE-RESOURCE; see ADR 0009 + ADR 0023). SCOPE: the ENTERPRISE network BEYOND the
# platform's own substrate networking — corporate WAN, internet/ cloud edge, site-to-site/remote connectivity.
# The platform's in-cluster/in-fabric networking is ITO SUB.

- id: NET-CON
  term: Connectivity Provisioning & WAN
  type: Domain
  definition: >
    Provisioning and operating the enterprise wide-area network and its edges — site/branch connectivity, the
    corporate WAN backbone and overlay with dynamic path selection, internet-edge transport, and cloud/SaaS
    on-ramp — over any IP transport. Provides the enterprise connectivity the platform and its consumers reach
    the wider world across; distinct from the platform's in-fabric networking (ITO SUB).
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-NETWORK}
  source: ADR 0023

- id: NET-SEG
  term: Network Security & Segmentation
  type: Domain
  definition: >
    Enterprise-edge network security and segmentation — edge firewalling and policy enforcement, secure web/
    internet egress, network segmentation and micro-segmentation between sites/zones/application groups, and
    governance of access to cloud applications. Enforces enterprise security policy on the network path;
    applies (does not author) the enterprise control catalog and threat intelligence (Enterprise Security/GRC),
    and is distinct from platform/workload security (ITO SEC).
  relates_to:
    - {rel: grouped_by, target: PLANE-SECURITY}
    - {rel: belongs_to_service_domain, target: SD-NETWORK}
  source: ADR 0023

- id: NET-RAX
  term: Remote & Secure Access
  type: Domain
  definition: >
    Secure connectivity into and between the enterprise — site-to-site secure interconnect linking offices,
    data centers, and cloud networks; remote-workforce secure access; and zero-trust, identity- and posture-
    conditioned network access to applications. Consumes the enterprise identity of record and device posture
    (owned by Enterprise Security/GRC and End-User Computing); does not own them.
  relates_to:
    - {rel: grouped_by, target: PLANE-SECURITY}
    - {rel: belongs_to_service_domain, target: SD-NETWORK}
  source: ADR 0023

- id: NET-DDI
  term: Naming, Addressing & DNS (DDI)
  type: Domain
  definition: >
    The enterprise-edge naming, addressing, and DNS foundation — authoritative DNS resolution and zones,
    dynamic address assignment, and IP address-space management (the authoritative address record/plan) kept
    consistent and conflict-free across hybrid sites. Owns the enterprise DDI service and record; per-workload
    service discovery and in-fabric addressing inside the platform are ITO SUB.
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-NETWORK}
  source: ADR 0023

- id: NET-QOS
  term: Network Performance & Quality of Service
  type: Domain
  definition: >
    Predictable network service for the traffic that needs it — traffic classification and prioritization,
    traffic shaping and bandwidth management, application-aware path selection and optimization, and management
    of network performance against intended experience targets. Manages the network path's performance;
    application-internal performance and the end-user device experience belong to adjacent domains.
  relates_to:
    - {rel: grouped_by, target: PLANE-OPERATIONS}
    - {rel: belongs_to_service_domain, target: SD-NETWORK}
  source: ADR 0023

- id: NET-OBS
  term: Network Observability & Assurance
  type: Domain
  definition: >
    Understanding and assuring the enterprise network — telemetry and flow collection, network performance and
    health monitoring, assurance that the network is meeting its intended service level, and visibility of
    topology, configuration, and change. Observes the enterprise network path and edges; platform/workload
    observability is ITO OBS and the end-user digital-experience view is End-User Computing.
  relates_to:
    - {rel: grouped_by, target: PLANE-OPERATIONS}
    - {rel: belongs_to_service_domain, target: SD-NETWORK}
  source: ADR 0023

- id: NET-RES
  term: Network Resilience & Continuity
  type: Domain
  definition: >
    Keeping enterprise connectivity available through failure — redundant and diverse-path connectivity,
    automatic failover with fast, stable convergence, network capacity and load distribution, and verified
    network continuity and recovery. Owns network-path resilience (links, paths, edges); facility power/
    cooling resilience is Data Center & Facilities and platform/workload resilience is ITO — both interfaced.
  relates_to:
    - {rel: grouped_by, target: PLANE-RESOURCE}
    - {rel: belongs_to_service_domain, target: SD-NETWORK}
  source: ADR 0023
