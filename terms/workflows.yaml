# ITPRA ontology — T1 workflow diagrams
# The Mermaid diagrams that render the journeys. type: Workflow; ids WF-<slug> (zero or more per journey). Each
# is `realized_in` exactly one journey (JRN-<slug>) Neutral — diagrams use capability ids + neutral construct
# points (request/approval/change/incident/record), no tools or named processes. Ratified vehicle: ADR 0013.

- id: WF-onboard-consumer
  term: Onboard a Consumer Team & Tenant (diagram)
  type: Workflow
  definition: Flow diagram of the consumer/tenant onboarding journey.
  relates_to:
    - {rel: realized_in, target: JRN-onboard-consumer}
  source: ADR 0013

