# ITPRA ontology — meta-schema
# This file defines the SHAPE of every term record and the controlled value sets the linter enforces.
# It is data, not a term list. Term lists live in entities.yaml, relationships.yaml, and terms/.

# schema_version = the shape of a term RECORD (the fields/value-sets below); bump only when that shape changes.
# ontology_version = the CONTENT version of the vocabulary (Semantic Versioning; ADR 0003). MAJOR = an id removed
# or renamed, a verb's meaning changed, a type/value dropped, a parser-breaking schema change, a base-IRI or
# licence change; MINOR = additive terms/types/verbs/fields and a term retirement; PATCH = editorial wording,
# comments, metadata. Every change bumps ontology_version in the same change (ADR 0003); consumers pin a release.
schema_version: 2
ontology_version: 3.16.3

# ---- id rules -------------------------------------------------------------
id:
  # Globally unique across all ontology files. Letters/digits plus _. - (ADR 0004: no /, which would split a
  # slash-form IRI. stays for the child-capability form CAP-<DOMAIN>-<n>.<m>, legal inside an IRI path segment).
  # Enforced on ontology term records; a consumer's package-local ids are checked by its own linter.
  pattern: "^[A-Za-z][A-Za-z0-9_.-]*$"
  conventions:
    EntityType:        "UPPER_SNAKE (e.g. CAPABILITY, OPERATING_MODEL)"
    RelationshipType:  "lower_snake verb (e.g. grouped_by, met_by)"
    QualityAttribute:  "UPPER token (e.g. AVAILABILITY)"
    capability_instance: "CAP-<DOMAIN>-<n>"
    function_instance:   "FUNC-<slug>"   # granular behavior below capabilities; shared cross-domain (ADR 0011)
    persona_instance:    "PERSONA-<slug>"
    journey_instance:    "JRN-<slug>"
    workflow_instance:   "WF-<slug>"
    requirement_FR:      "FR-<CODE>-<n>"           # <CODE> = the owning service-domain or capability-domain code (FR-FND-1, FR-ADM-38)
    requirement_NFR:     "NFR-<QA>-<n> | NFR-<CODE>_<QA>-<n>"  # the first service domain uses the first form; every other
                         # domain joins its code to the QA with _ so the id stays one segment; a compound QA keeps
                         # its own _ (NFR-ADM_COST_EFFICIENCY-1). Both forms are canonical (ADR 0004).
    concept_instance:    "<UPPER-KEBAB> (e.g. AUTON-BOUNDARY, KNOWLEDGE-ROLE, GC-APPROVAL)"
    coverage_area:       "AREA-<slug>"       # AREA-baseline is the declared enterprise-standard area (ADR 0029)
    adr_instance:        "ADR-<NNNN>"
    service_domain_instance: "SD-<slug>"
  # Prefixes whose ids are NOT ontology records (ADR 0004). A consumer's linter accepts met_by / verified_by
  # references by prefix without resolving them; only the three below have no record by design.
  reserved_prefixes:
    SVC: "package-local service instances in a derived (T2/T3) architecture; no T1 record; no current use"
    OQ:  "open-question ids in a consumer's decision backlog (OQ-<n> or OQ-<CODE>-<n>); resolved by a decision record, never a term"
    ADR: "decision-record references (ADR-NNNN in registries and waivers; `ADR NNNN` in source = the ITPRA ontology's record of that number, in decisions/); a consumer's own records are cited by URL (ADR 0005)"

# ---- term record fields ---------------------------------------------------
fields:
  id:         {required: true,  kind: string}
  term:       {required: true,  kind: string}
  type:       {required: true,  kind: enum, enum_ref: types}
  definition: {required: true,  kind: string}
  aliases:    {required: false, kind: list}
  deprecated: {required: false, kind: list}      # banned synonyms, recorded for authors and projected as hidden
                                                 # labels; NOT machine-enforced (the words occur legitimately
                                                 # elsewhere; advisory, ADR 0007)
  relates_to: {required: false, kind: relation_list}
  source: {required: false, kind: string}
  # `source` grammar (ADR 0005): one or more citations separated by "; ", each either
  # ADR NNNN - the decision that minted the record
  # ADR NNNN (amended by ADR NNNN[, ADR NNNN]) - later decisions that changed it in place
  # ADR NNNN (extended by ADR NNNN) - later decisions that added to it
  # <external citable reference> - e.g. ISO/IEC 25010, NIST AI RMF, well-architected (optionally with a parenthetical);
  # another project's decision record is cited the same way, as free text carrying its URL
  # `ADR NNNN` always means the ITPRA ontology's record of that number (decisions/). An item carrying a URL is external in its
  # entirety, whatever it mentions, and is never a decidedIn link. The RDF projection parses each ADR NNNN to a decidedIn link and
  # keeps the whole string as dcterms:source.
  # Note: prior to schema_version 2, term records also carried an optional `itpra_tier` field (enum T1|T2|T3|all). The field
  # was removed (ADR 0011): the tier a term is admissible at is inferred from where it lives (this vocabulary = T1), not declared.

# ---- allowed `type` values ------------------------------------------------
types:
  - EntityType          # a kind of thing the architecture is built from
  - RelationshipType    # a verb usable in relates_to
  - QualityAttribute    # an NFR category
  - Domain              # an instance of the DOMAIN entity type (a capability domain)
  - Plane               # a grouping of capability domains by concern (PLANE-<slug>; ADR 0010)
  - Concept             # a defined idea that is not an entity/relationship/QA
  - Capability          # an instance of the CAPABILITY entity type (CAP-<DOMAIN>-<n>)
  - Function            # an instance of the FUNCTION entity type — a granular behavior below a capability (FUNC-<slug>; ADR 0011)
  - Persona             # an instance of the PERSONA entity type (PERSONA-<slug>)
  - JourneyGroup        # a grouping of journeys by lifecycle phase/concern (JG-<slug>; ADR 0013)
  - Journey             # an instance of the JOURNEY entity type (JRN-<slug>; ADR 0013)
  - Workflow            # an instance of the WORKFLOW entity type (WF-<slug>; ADR 0013)
  - ServiceDomain       # an IT service domain in the enterprise landscape (SD-<slug>; ADR 0009)
# Note: instance kinds are added here as they are introduced so the linter can validate each
# record's `type`.

# ---- relationship verb vocabulary (the `rel` in relates_to) ---------------
# The linter validates every relates_to.rel against this list. Each verb is also
# documented as a term in relationships.yaml.
relationships:
  - grouped_by          # X is organized under Y
  - consumed_by         # X is used by persona/role Y
  - realized_in         # X is exercised by journey/workflow Y
  - depends_on          # X requires Y to function
  - decomposes_into     # X (broader) decomposes into finer child Y (e.g. T1 cap -> T2 child caps)
  - supports            # function X supports / helps realize capability Y (many-to-many; ADR 0011)
  - met_by              # requirement X is satisfied by element Y
  - verified_by         # requirement/element X is demonstrated by journey/check Y
  - categorized_as      # X belongs to category Y
  - derived_from        # tier-N element X derives from tier-(N-1) element Y
  - supersedes          # X replaces Y
  - owns                # persona X is accountable for Y
  - governs             # operating-model/policy X constrains Y
  - applies_to          # X is relevant to scope Y
  - produces            # X yields Y
  - interfaces_with     # X exchanges with Y across a boundary, neither containing the other (ADR 0009)
  - belongs_to_service_domain  # X is owned by exactly one (single-valued) service domain Y (ADR 0009)


