# itpra-onto configuration for the ITPRA ontology repository.
#
# Read by itpra_onto.config.load_config(); every command reads [iri] and [paths]. Paths are relative to this
# file's directory (tools/itpra-onto/); the vocabulary is the repository root.
#
# [iri] base is the one place the base IRI is written (ADR 0004): a term is <base>id/CAP-FND-1, the schema
# <base>onto#, a named graph <base>graph/t1 and the version IRI <base>onto/X.Y.Z. One base in every
# environment; a change rewrites every IRI and is MAJOR. `itpra-onto release` refuses a reserved `.invalid`
# host (itpra_onto.config.is_placeholder_base_iri()), which is what the tests use to exercise the refusal.

[iri]
base = "https://itpra.4thtry.tech/"
id_path = "id/"
onto_path = "onto#"
graph_path = "graph/"

[paths]
repo_root = "../.."
ontology_dir = "../.."
dist_dir = "../../dist"
store_dir = ".store"

[python]
pinned = "3.12"
