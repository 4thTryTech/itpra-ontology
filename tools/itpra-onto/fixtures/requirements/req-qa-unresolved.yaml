# A real, currently-clean NFR whose `qa` is pointed at an id with no QualityAttribute record must raise
# exactly one req-qa-unresolved Violation, on itself. The emitter accepts the bad qa value fine (it emits
# `itpra-o:categorizedAs itpra:NOPE` with no crash) -- only the shape catches it.
rule: req-qa-unresolved
expect:
  severity: Violation
  focus: NFR-AVAILABILITY-1
  count: 1
mutate:
  id: NFR-AVAILABILITY-1
  set: {qa: NOPE}
