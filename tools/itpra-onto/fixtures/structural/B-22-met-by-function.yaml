# Proves the generated B-22 shape for met_by (shapes/generated/verb-pairs.ttl, itpra-o:VerbPairsMetByShape):
# FR-FND-1's met_by is repointed from CAP-FND-1 to FUNC-version-control
# (a real, resolved Function). met_by's itpra_verb pairs are (FR, Capability) and (NFR, Capability);
# (FR, Function) is one Violation.
#
# This mutation is deliberately NOT filed under the linter's comparable req-target-unresolved id: the linter
# never checks a type (FUNC- is one of its INSTANCE_PREFIXES, and the id resolves). Typing is B-22's, under
# its own Table B id; req-target-unresolved mirrors the linter (its fixture is a dangling, unprefixed id).
#
# A clean single-rule proof: the target resolves and carries an instance prefix, so req-target-unresolved is
# silent (as it is for the linter); met_by stays non-empty (B-4 silent). The linter reports nothing
# (verdict: shacl-only).
rule: B-22
expect:
  severity: Violation
  focus: FR-FND-1
  count: 1
mutate:
  id: FR-FND-1
  set: {met_by: [FUNC-version-control]}
