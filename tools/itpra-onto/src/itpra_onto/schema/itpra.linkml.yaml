            - "DOMAIN -> SERVICE_DOMAIN"
          inverse_name: null

# -----------------------------------------------------------------------------------------------------
classes:
  Term:
    abstract: true
    class_uri: skos:Concept
    description: >-
      The shape shared by every term record (schema.yaml `fields:`). Abstract:
      every record is validated as the subclass its `type` names.
    slots: [id, term, type, definition, aliases, deprecated, relates_to, source, retired, replaced_by]

  RelatesTo:
    class_uri: itpra-o:RelatesTo
    description: >-
      One authored edge {rel, target}. Authoring shape only — the emitter pivots it onto the verb's
      own predicate (the `verbs` subset) and never publishes a RelatesTo node.
    slots: [rel, target]

  # ---- one subclass per `type` value (schema.yaml `types:`) ----
  Capability:
    is_a: Term
    class_uri: itpra:CAPABILITY
    annotations: {entity_type_id: CAPABILITY}
    slot_usage:
      type: {pattern: "^Capability$"}
      relates_to:
        required: true
