          domain: [NFR]
          range: [QualityAttribute]
          pairs:
            - {subject: NFR, object: QualityAttribute, count: 0}
          cardinality: []
          observed: []
          meta_edges:
            - "NFR -> QUALITY_ATTRIBUTE"
          inverse_name: null
  derived_from:
    in_subset: [verbs]
    slot_uri: itpra-o:derivedFrom
    multivalued: true
    range: Term
    see_also: [itpra:derived_from]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: definition
          domain: [Capability]
          range: [Capability]
          pairs:
            - {subject: Capability, object: Capability, count: 0}
          cardinality:
            - {subject: Function, min: 0, max: 0}
          observed: []
          meta_edges:
            - "CAPABILITY -> CAPABILITY"
          inverse_name: null
  supersedes:
    in_subset: [verbs]
    slot_uri: itpra-o:supersedes
    multivalued: true
    range: Term
    see_also: [itpra:supersedes]
    annotations:
