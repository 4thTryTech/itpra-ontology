# =====================================================================================================
# ITPRA ontology — LinkML schema of the AUTHORING shape
# =====================================================================================================
#
# What this file describes
#   The YAML exactly as it is authored, validated unchanged:
#     every terms/*.yaml, entities.yaml and relationships.yaml in the ontology directory ([paths]
#     ontology_dir) — a BARE top-level list of term records, validated record by record against the
#     class named by the record's `type` (see "Validation" below).
#   It is NOT the published RDF shape. The emitter pivots each `relates_to` {rel, target} entry onto one
#   predicate per verb (ADR 0041 D2); that is why the 17 verbs are also declared below as slots, carrying
#   the per-verb metadata the emitter and the SHACL shapes read (ADR 0008).
#
# What is authored where
#   schema.yaml              : the `types:` and `relationships:` value lists, the id pattern.
#   generated/itpra-enums.linkml.yaml : EntityTypeEnum + RelationshipVerbEnum, GENERATED from those two
#                              lists by `itpra-onto gen-enums` — never edit by hand.
#   THIS file                : record shape, per-type refinement (slot_usage),
#                              predicate mappings (slot_uri / class_uri), and per-verb
#                              domain / range / cardinality / inverse (the `itpra_verb` annotations).
#   A test asserts the `id` pattern below equals schema.yaml's `id.pattern`.
#
# The base IRI is a configuration item (ADR 0004)
#   Nothing below is a literal IRI under the base. itpra-onto.toml [iri] (base / id_path / onto_path /
#   graph_path) is the single source. Concretely:
#     itpra:    <base>id/     one IRI per term record                               — generated,
#     itpra-o:  <base>onto#   the schema vocabulary: verb properties, bannedLabel, …          see
#     itpra-g:  <base>graph/  named graphs                                          — generated/itpra-prefixes.linkml.yaml
#   This schema imports that generated fragment instead of declaring the three prefixes itself. Its own
#   `id:` still has to be a literal LinkML requires directly on this file — schema/README.md and
#   src/itpra_onto/schema_loading.py explain why that one field is substituted in memory at load time
#   instead of being a fourth generated fragment.
#
# Language
#   Every label and definition (`term`, `definition`, `aliases`, `deprecated`) is English.
#   The emitter tags them "@en". The YAML carries no language tag and gains none.
#
# Slot names `aliases` / `deprecated`
#   Kept as the real YAML keys. Verified on linkml 1.11.1 (tests/test_schema.py): a user slot named
#   `aliases` or `deprecated` validates, generates JSON Schema / OWL / SHACL, and is induced by SchemaView
#   like any other slot — the metamodel's own element-level `aliases`/`deprecated` live in a different
#   scope. No renaming loader is needed. Predicate mappings:
#     aliases    -> skos:altLabel
#     deprecated -> itpra-o:bannedLabel  (rdfs:subPropertyOf skos:hiddenLabel; expressed here as
#                   slot_uri + broad_mappings: skos:hiddenLabel)
#
# Retirement (ADR 0048)
#   retired     -> itpra-o:retiredIn, and the record also gets owl:deprecated true
#   replaced_by -> dcterms:isReplacedBy <successor>
#
# Validation (itpra-onto validate --authoring)
#   Term files are bare lists. The validator dispatches each record to the subclass whose `type`
#   slot_usage pins the value with `pattern: "^<value>$"` (e.g. `type: Function` -> Function); a record
#   whose `type` names no subclass is validated against `Term`, which fails on the enum. The pin is a
#   pattern, not `equals_string`, because gen-shacl 1.11.1 refuses equals_string on an enum-ranged
#   slot (it emits sh:in for the enum plus sh:pattern for the pin instead).
#   `linkml-validate --target-class Term <file>` on its own checks the shared record shape only
#   (JSON Schema validates the named class, not its descendants).
#   Constraints that JSON Schema can check are declared natively (pattern, required, enum,
#   minimum_cardinality, has_member = "at least one edge with this verb", all_members = "no edge with this
#   verb"). Everything else — edge target types, at-most-one per verb, id resolution — is carried in
#   the `itpra_verb` annotations for the emitter / the SHACL shapes (JSON Schema has no
#   maxContains in the LinkML generator, and `target` is a reference string, not a typed node).
#
# ---- Annotation grammar: `itpra_verb` (one per verb slot, 17 in total, subset `verbs`) --------------
#   annotations:
#     itpra_verb:
#       value:
#         carried_by: relates_to                   # where the YAML authors the edge: a relates_to entry
#                                                   # with this `rel`
#         evidence:   data | meta-only | definition  # data = domain/range read off instance records;
#                                                   # meta-only = zero instances, pairs taken from the
#                                                   # entities.yaml meta-edges; definition = zero
#                                                   # instances AND zero meta-edges, pairs taken from
#                                                   # the relationships.yaml definition text
#         domain:    [<Class>, …]                 # sorted, = the distinct `subject`s of `pairs`
#         range:      [<Class>, …]                 # sorted, = the distinct `object`s of `pairs`
#         pairs:                                   # the ALLOWED (subject, object) combinations —
#           - {subject: <Class>, object: <Class>, count: <int>}   # count = instance edges at 5.0.0
#           # The numeric fields (pairs[].count, observed[].records/min/max) are a SNAPSHOT at the version
#           # named above, refreshed by a line-based edit from `uv run python -m itpra_onto.profile`
#           # (never round-tripped through a YAML dumper). tests/test_schema.py checks the (subject, object) pairs, meta-edges and
#           # cardinalities exactly and reports count drift as a warning, so a routine mint does not fail CI.
#           # After a refresh, `itpra-onto gen-artifacts --check` reports dist/schema stale until re-run.
#         cardinality:                             # DECLARED rules (enforced by the SHACL shapes)
#           - {subject: <Class>, min: <int>, max: <int|null>}     # null = unbounded; Term = every record
#         observed:                                # per-subject edge counts per record, read off the data
#           - {subject: <Class>, records: <int>, min: <int>, max: <int>}  # records = records of that
#                                                   # type (min 0 = some records carry no such edge)
#         meta_edges: ["<ENTITY_TYPE> -> <ENTITY_TYPE>", …]  # entities.yaml relates_to, verbatim
#         inverse_name: null                       # ADR 0041 D4: no named inverses minted
#   <Class> is a LinkML class name of this schema, or — only where no `type` value (hence no class)
#   exists — an UPPER_SNAKE EntityType id (SERVICE, ADR, ITPRA_TIER, OPERATING_MODEL, TENANT, FR, NFR,
#   REQUIREMENT).
#   Keys are never `on`/`yes`/`no` (YAML 1.1 booleans).
#
# ---- Annotation grammar: classes ---------------------------------------------------------------------
#   entity_type_id: <EntityType id> | none   the entities.yaml record this class is punned with
#                                           (the `type` value <-> EntityType id bridge);
#                                           none = no EntityType record exists (candidate mint noted
#                                           in `entity_type_note`)
# =====================================================================================================

id: __GENERATED_SCHEMA_ID__  # substituted at load time by itpra_onto.schema_loading from
                              # itpra-onto.toml [iri] base — never a literal IRI here (ADR 0004)
name: itpra
title: ITPRA ontology — authoring schema
description: >-
  LinkML description of the ITPRA ontology's authoring shape (the term records in the ontology
  directory). The base IRI is a configuration item (itpra-onto.toml [iri], ADR 0004).
version: 0.1.0
prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  owl: http://www.w3.org/2002/07/owl#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  sh: http://www.w3.org/ns/shacl#
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: itpra-o
default_range: string
imports:
  - linkml:types
  - generated/itpra-prefixes.linkml  # itpra: / itpra-o: / itpra-g:, generated from itpra-onto.toml [iri]
  - generated/itpra-enums.linkml     # LinkML appends ".yaml": generated/itpra-enums.linkml.yaml

subsets:
  verbs:
    description: The 17 relationship verbs of schema.yaml `relationships:`, one slot each.

# -----------------------------------------------------------------------------------------------------
slots:
  # ---- the ten authored term fields (schema.yaml `fields:`) ----
  id:
    identifier: true
    required: true
    pattern: "^[A-Za-z][A-Za-z0-9_.-]*$"   # = schema.yaml id.pattern (test-enforced; ADR 0004)
    slot_uri: dcterms:identifier
    description: Globally unique record id; also the IRI local name under itpra:.
  term:
    required: true
    slot_uri: skos:prefLabel
    description: Preferred label (English).
  type:
    required: true
    range: EntityTypeEnum
    slot_uri: rdf:type
    description: >-
      Record kind; resolved to the class_uri of the matching subclass (the type <-> EntityType bridge).
  definition:
    required: true
    slot_uri: skos:definition
    description: Definition (English); folded scalars normalised to single spaces on emit.
  aliases:
    multivalued: true
    slot_uri: skos:altLabel
    description: Alternative labels (English).
  deprecated:
    multivalued: true
    slot_uri: itpra-o:bannedLabel
    broad_mappings:
      - skos:hiddenLabel
    description: >-
      Banned synonyms — words that must not be used for this concept. Emitted as itpra-o:bannedLabel,
      a sub-property of skos:hiddenLabel. Not a retirement marker (that is `retired`, ADR 0048).
  relates_to:
    multivalued: true
    range: RelatesTo
    inlined: true
    inlined_as_list: true
    slot_uri: itpra-o:relatesTo
    description: >-
      Authoring-shape (reified) edges. Pivoted by the emitter onto one predicate per verb; never
      published as RelatesTo nodes.
  source:
    slot_uri: dcterms:source
    description: >-
      Provenance text, verbatim ("ADR NNNN" = this repository's own record, optional amend/extend tail, or an
      external citable reference -- another project's record carries its URL). The grammar is parsed by the
      emitter (ADR 0005), not constrained here.
  retired:
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    slot_uri: itpra-o:retiredIn
    description: >-
      The ontology_version (X.Y.Z) that retired the record; its presence marks the record retired (ADR 0048).
      Emitted as itpra-o:retiredIn beside owl:deprecated true; the record otherwise projects unchanged.
  replaced_by:
    range: Term
    slot_uri: dcterms:isReplacedBy
    description: >-
      Id of the record that succeeds a retired one (a reference, not an inlined record; ADR 0048). Allowed
      only beside `retired`; resolves to another record.

  # ---- RelatesTo ----
  rel:
    required: true
    range: RelationshipVerbEnum
    slot_uri: itpra-o:rel
  target:
    required: true
    range: Term
    slot_uri: itpra-o:target
    description: Id of another record (a reference, not an inlined record).

  # ---- the 17 relationship verbs (published shape: one predicate each; split IRI) ----
  # Property IRI itpra-o:<camelCase>; the RelationshipType catalogue record stays itpra:<snake_case>.
  grouped_by:
    in_subset: [verbs]
    slot_uri: itpra-o:groupedBy
    multivalued: true
    range: Term
    see_also: [itpra:grouped_by]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: data
          domain: [Capability, Domain, Journey]
          range: [Domain, JourneyGroup, Plane]
          pairs:
            - {subject: Capability, object: Domain, count: 400}
            - {subject: Domain, object: Plane, count: 82}
            - {subject: Journey, object: JourneyGroup, count: 149}
          cardinality:
            - {subject: Capability, min: 1, max: 1}
            - {subject: Domain, min: 1, max: 1}
            - {subject: Journey, min: 1, max: 1}
          observed:
            - {subject: Capability, records: 400, min: 1, max: 1}
            - {subject: Domain, records: 82, min: 1, max: 1}
            - {subject: Journey, records: 149, min: 1, max: 1}
          meta_edges:
            - "CAPABILITY -> DOMAIN"
            - "DOMAIN -> PLANE"
            - "JOURNEY -> JOURNEY_GROUP"
            - "JOURNEY_GROUP -> ITPRA_TIER"
            - "PLANE -> ITPRA_TIER"
          inverse_name: null
  consumed_by:
    in_subset: [verbs]
    slot_uri: itpra-o:consumedBy
    multivalued: true
    range: Term
    see_also: [itpra:consumed_by]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: data
          domain: [Capability, Journey]
          range: [Persona]
          pairs:
            - {subject: Capability, object: Persona, count: 667}
            - {subject: Journey, object: Persona, count: 261}
          cardinality: []
          observed:
            - {subject: Capability, records: 400, min: 1, max: 3}
            - {subject: Journey, records: 149, min: 1, max: 3}
          meta_edges:
            - "CAPABILITY -> PERSONA"
            - "JOURNEY -> PERSONA"
            - "SERVICE -> PERSONA"
            - "TENANT -> PERSONA"
          inverse_name: null
  realized_in:
    in_subset: [verbs]
    slot_uri: itpra-o:realizedIn
    multivalued: true
    range: Term
    see_also: [itpra:realized_in]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: meta-only
          domain: [Capability, Workflow]
          range: [Journey]
          pairs:
            - {subject: Capability, object: Journey, count: 0}
            - {subject: Workflow, object: Journey, count: 0}
          cardinality: []
          observed: []
          meta_edges:
            - "CAPABILITY -> JOURNEY"
            - "WORKFLOW -> JOURNEY"
          inverse_name: null
  depends_on:
    in_subset: [verbs]
    slot_uri: itpra-o:dependsOn
    multivalued: true
    range: Term
    see_also: [itpra:depends_on]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: data
          domain: [Capability, Concept, Function, Journey]
          range: [Capability, Concept, Function]
          pairs:
            - {subject: Capability, object: Capability, count: 320}
            - {subject: Concept, object: Concept, count: 5}
            - {subject: Concept, object: Function, count: 5}
            - {subject: Function, object: Function, count: 2}
            - {subject: Journey, object: Capability, count: 582}
          cardinality: []
          observed:
            - {subject: Capability, records: 400, min: 0, max: 4}
            - {subject: Concept, records: 29, min: 0, max: 3}
            - {subject: Function, records: 772, min: 0, max: 2}
            - {subject: Journey, records: 149, min: 1, max: 13}
          meta_edges:
            - "CAPABILITY -> CAPABILITY"
            - "CONCEPT -> CONCEPT"
            - "CONCEPT -> FUNCTION"
            - "FUNCTION -> FUNCTION"
            - "JOURNEY -> CAPABILITY"
          inverse_name: null
  decomposes_into:
    in_subset: [verbs]
    slot_uri: itpra-o:decomposesInto
    multivalued: true
    range: Term
    see_also: [itpra:decomposes_into]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: meta-only
          domain: [Capability]
          range: [Capability]
          pairs:
            - {subject: Capability, object: Capability, count: 0}
          cardinality: []
          observed: []
          meta_edges:
            - "CAPABILITY -> CAPABILITY"
          inverse_name: null
  supports:
    in_subset: [verbs]
    slot_uri: itpra-o:supports
    multivalued: true
    range: Term
    see_also: [itpra:supports]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: data
          domain: [Function]
          range: [Capability]
          pairs:
            - {subject: Function, object: Capability, count: 871}
          cardinality:
            - {subject: Function, min: 1, max: null}
          observed:
            - {subject: Function, records: 772, min: 1, max: 4}
          meta_edges:
            - "FUNCTION -> CAPABILITY"
          inverse_name: null
  met_by:
    in_subset: [verbs]
    slot_uri: itpra-o:metBy
    multivalued: true
    range: Term
    see_also: [itpra:met_by]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: meta-only
          domain: [FR, NFR, REQUIREMENT]
          range: [Capability]
          pairs:
            - {subject: FR, object: Capability, count: 0}
            - {subject: NFR, object: Capability, count: 0}
            - {subject: REQUIREMENT, object: Capability, count: 0}
          cardinality: []
          observed: []
          meta_edges:
            - "FR -> CAPABILITY"
            - "NFR -> CAPABILITY"
            - "REQUIREMENT -> CAPABILITY"
          inverse_name: null
  verified_by:
    in_subset: [verbs]
    slot_uri: itpra-o:verifiedBy
    multivalued: true
    range: Term
    see_also: [itpra:verified_by]
    annotations:
      itpra_verb:
        value:
          carried_by: relates_to
          evidence: meta-only
          domain: [FR, NFR, REQUIREMENT]
          range: [Journey]
          pairs:
            - {subject: FR, object: Journey, count: 0}
            - {subject: NFR, object: Journey, count: 0}
            - {subject: REQUIREMENT, object: Journey, count: 0}
          cardinality: []
          observed: []
          meta_edges:
            - "FR -> JOURNEY"
            - "NFR -> JOURNEY"
            - "REQUIREMENT -> JOURNEY"
          inverse_name: null
  categorized_as:
    in_subset: [verbs]
    slot_uri: itpra-o:categorizedAs
    multivalued: true
    range: Term
    see_also: [itpra:categorized_as]
    annotations:
      itpra_verb:
        value:
