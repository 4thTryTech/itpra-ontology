# Proves the emit-time enforcement of shapes/REGISTER.md Table A's `type-unknown` row (mechanism
# `generated`; emit.term_triples: `cls = vocab.term_class[rec["type"]]` raises KeyError -> EmitError "has
# type ..., which no Term subclass pins" for a value not pinned by any Term subclass's `slot_usage`). Exists
# for `itpra-onto parity`: `generated` rows get no shape or fixture on their own (shapes/README.md: only
# REGISTER.md's rows marked mechanism core or sparql get a shape there) — but the --fixtures comparison needs
# at least one emit-time-mapped fixture per shapes/REGISTER.md's "generated" family to exercise the parity
# module's emit-error -> Table A id recovery (parity.nominal_rule_id), alongside relates-to-malformed.yaml.
# Rewriting
# CAP-ITO-FND-1's own `type` to a value no Term subclass pins raises exactly one synthetic `emit-error` finding
# on CAP-ITO-FND-1 (fixtures.run_fixture's own EmitError-catching convention, used by every other emit-time
# guard's fixture in this directory); the linter, run against the same mutation, independently
# reports its own `type-unknown` finding on CAP-ITO-FND-1 -- confirming both sides catch this defect, just under
# different labels (the point of the parity check). `emit_error: EmitError` requires the finding to be
# this guard's own EmitError (the base class; the message names the unpinned type).
rule: emit-error
expect:
  severity: Violation
  focus: CAP-ITO-FND-1
  count: 1
  emit_error: EmitError
mutate:
  id: CAP-ITO-FND-1
  set:
    type: Nope
