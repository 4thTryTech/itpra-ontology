# Proves the generated B-22 shape for belongs_to_service_domain (shapes/generated/verb-pairs.ttl,
# itpra-o:VerbPairsBelongsToServiceDomainShape): CAP-ITO-FND-1 gains a
# belongs_to_service_domain edge to SD-IT-OPERATIONS (a real ServiceDomain). The verb's one itpra_verb pair is
# (Domain, ServiceDomain) — a Capability's service domain is attributed through
# its Domain (ADR 0009), never directly — so (Capability, ServiceDomain) is one Violation.
#
# A clean single-rule proof: the target resolves (target-unresolved silent); CAP-ITO-FND-1 now has exactly one
# belongs_to_service_domain edge, within B-3-belongs-to-service-domain's at-most-one bound for a non-Domain
# term; the inServiceDomain roll-up (rules/20) reads the Domain's edge, not the Capability's, so B-19 is
# unchanged. The linter has no domain/range check (verdict: shacl-only).
rule: B-22
expect:
  severity: Violation
  focus: CAP-ITO-FND-1
  count: 1
mutate:
  id: CAP-ITO-FND-1
  append_relates_to: {rel: belongs_to_service_domain, target: SD-IT-OPERATIONS}
