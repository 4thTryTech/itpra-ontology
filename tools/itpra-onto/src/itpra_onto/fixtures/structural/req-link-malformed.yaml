# Proves the emit-time enforcement of shapes/REGISTER.md Table A's `req-link-malformed` row (mechanism
# `python` — emit.check_requirement_record raises EmitError for a met_by / verified_by that is not a list).
# FR-FND-1's met_by, `[CAP-ITO-FND-1]`, is written as the bare scalar `CAP-ITO-FND-1`. Without this guard the emitter
# would read a scalar as a one-element list and the linter would iterate its characters (one
# req-target-unresolved warning per letter); instead the emitter raises this guard's EmitError on FR-FND-1
# and the linter reports req-link-malformed on FR-FND-1 (verdict: both). Kept in this
# directory, as type-unknown.yaml is, because fixtures/requirements/ holds only its shape-bearing ids
# (tests/test_shapes_requirements.py).
rule: emit-error
expect:
  severity: Violation
  focus: FR-FND-1
  count: 1
  emit_error: EmitError
mutate:
  id: FR-FND-1
  set: {met_by: CAP-ITO-FND-1}
