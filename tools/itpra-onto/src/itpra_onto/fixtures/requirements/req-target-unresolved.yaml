# A real, currently-clean FR whose met_by is repointed at ZZZ-1 — an id no record has, whose first segment
# (ZZZ) is none of the linter's INSTANCE_PREFIXES — must raise exactly one req-target-unresolved Warning, on
# itself, on BOTH sides: the linter (no term/requirement id matches and the prefix fallback does not apply)
# and shapes/requirements.ttl's itpra-o:ReqTargetUnresolvedShape (untyped object, unprefixed local name),
# which mirrors the linter exactly.
#
# Repointing met_by at FUNC-ito-version-control instead would prove a typed check the linter never makes; that
# mutation proves B-22 (fixtures/structural/B-22-met-by-function.yaml). B-22 ignores a
# dangling object (it is this rule's business), so nothing cascades; met_by stays non-empty (B-4 silent).
rule: req-target-unresolved
expect:
  severity: Warning
  focus: FR-FND-1
  count: 1
mutate:
  id: FR-FND-1
  set: {met_by: [ZZZ-1]}
