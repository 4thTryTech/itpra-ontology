# Proves itpra-o:ReqMetByNonEmptyShape (requirements.ttl; Table B B-4 -- a graph shape as well as a
# pre-emission closure; see requirements.ttl's own B-4 section and fixtures/requirements/README.md for why
# the pre-emission closure alone left a real gap). FR-FND-1 with `met_by` emptied to `[]` raises exactly one Violation of B-4: confirmed empirically
# (fixtures/requirements/README.md's own account) that `emit.emit()` never calls the authoring validator, so
# an empty `met_by` list reaches the graph untouched -- `_as_list([])` yields no itpra-o:metBy triples at
# all, which is exactly what this shape's sh:minCount 1 catches. `verified_by` is left intact
# (FR-FND-1 still carries `verified_by: [JRN-ito-patch-platform]`), so only the metBy arm fires -- the sibling
# itpra-o:ReqVerifiedByNonEmptyShape stays silent, and no cascade lands on the same focus.
rule: B-4
expect:
  severity: Violation
  focus: FR-FND-1
  count: 1
mutate:
  id: FR-FND-1
  set:
    met_by: []
