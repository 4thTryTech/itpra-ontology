# A brand-new FR whose id doesn't match FR-<DOMAIN>-<n> (no trailing -<n>) must raise exactly one
# req-id-format Violation, on itself.
rule: req-id-format
expect:
  severity: Violation
  focus: FR-ITO-BAD
  count: 1
add:
  file: registry:ITO/functional
  record:
    id: FR-ITO-BAD
    type: FR
    statement: A synthetic record that exists only to prove the req-id-format shape fires on a malformed FR id.
    target: ~
    met_by: [CAP-ITO-FND-1]
    verified_by: [JRN-ito-patch-platform]
