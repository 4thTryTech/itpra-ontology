# ITPRA ontology — ids and files renamed in 5.0.0 (ADR 0045)
# IT Operations takes its code on every id and file name, as the ten other service domains carry theirs. Each
# entry reads `old: new`; the new id is the old one with the code inserted, and a record's label, definition
# and relations are otherwise as they were. This is not a term file: a consumer rewrites its references with it
# (a registry's met_by and verified_by, documents, pins), and a resolver redirects <base>id/<old> to
# <base>id/<new>.
